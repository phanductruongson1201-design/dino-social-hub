<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BulkPoster — Mass Publisher</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
--bg: #0b0d12;
--panel: #141824;
--panel-2: #1a1f2e;
--line: #242b3a;
--text: #f2f4f8;
--muted: #8a92a6;
--accent: #f97316;
--accent-2: #fb923c;
--accent-dark: #c2410c;
--halo: rgba(249,115,22,0.35);
--green: #22c55e;
--red: #ef4444;
}
html, body { height: 100%; }
body {
font-family: 'Inter', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
background: var(--bg);
background-image:
radial-gradient(900px 500px at 85% -20%, rgba(249,115,22,0.08) 0%, transparent 60%),
radial-gradient(700px 400px at -10% 110%, rgba(251,146,60,0.05) 0%, transparent 60%);
color: var(--text);
display: flex; justify-content: center; align-items: center;
padding: 22px;
}
.wrap {
width: 100%; max-width: 680px;
border: 1px solid var(--line);
border-radius: 18px;
background: var(--panel);
box-shadow: 0 24px 80px rgba(0,0,0,0.5);
overflow: hidden;
}
/ ===== Top bar ===== /
.topbar {
display: flex; align-items: center;
padding: 18px 22px;
border-bottom: 1px solid var(--line);
background: rgba(20,24,36,0.7);
}
.brand { display: flex; align-items: center; gap: 12px; }
.brand-icon {
width: 40px; height: 40px; border-radius: 10px;
background: linear-gradient(135deg, var(--accent), var(--accent-2));
display: flex; justify-content: center; align-items: center;
font-size: 19px; font-weight: 800; color: #0b0d12;
box-shadow: 0 6px 18px var(--halo);
}
.brand h1 { font-size: 16px; font-weight: 800; letter-spacing: 0.2px; }
.brand small { display: block; font-size: 11px; color: var(--muted); font-weight: 400; margin-top: 1px; }
.spacer { flex: 1; }
.pill {
font-size: 11px; font-weight: 700;
padding: 6px 12px; border-radius: 20px;
background: rgba(34,197,94,0.1);
color: var(--green);
border: 1px solid rgba(34,197,94,0.3);
display: flex; align-items: center; gap: 6px;
}
.pill::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: var(--green); }
/ ===== Tabs ===== /
.tabs {
display: flex; gap: 4px;
padding: 12px 22px 0;
border-bottom: 1px solid var(--line);
}
.tab {
padding: 10px 16px; font-size: 13px; font-weight: 600;
color: var(--muted); cursor: pointer;
border: none; background: none;
border-bottom: 2px solid transparent;
transition: color 0.2s, border-color 0.2s;
}
.tab:hover { color: var(--text); }
.tab.active { color: var(--accent); border-bottom-color: var(--accent); }
/ ===== Body ===== /
.body { padding: 24px 22px; }
.group-label {
font-size: 11px; font-weight: 700; color: var(--muted);
text-transform: uppercase; letter-spacing: 1px;
margin-bottom: 10px;
}
.field { margin-bottom: 20px; }
.select-wrap { position: relative; }
select, .input, .textarea {
width: 100%; font-size: 14px; font-family: inherit;
background: var(--panel-2); color: var(--text);
border: 1px solid var(--line); border-radius: 10px;
padding: 13px 15px; transition: border-color 0.2s, box-shadow 0.2s;
}

ChatGPT:
.select-wrap select { appearance: none; -webkit-appearance: none; padding-right: 42px; cursor: pointer; }
.select-wrap::after {
content: '▾'; position: absolute; right: 16px; top: 50%;
transform: translateY(-50%); color: var(--muted); pointer-events: none;
}
.textarea { resize: vertical; min-height: 150px; line-height: 1.65; }
.input:focus, .textarea:focus, .select-wrap select:focus {
outline: none; border-color: var(--accent);
box-shadow: 0 0 0 3px rgba(249,115,22,0.12);
}
.input::placeholder, .textarea::placeholder { color: #56617a; }
.refresh {
display: inline-flex; align-items: center; gap: 6px;
font-size: 12px; color: var(--accent-2); cursor: pointer;
font-weight: 600; margin-top: 8px;
}
.refresh:hover { text-decoration: underline; }
.row { display: flex; gap: 14px; }
.row .field { flex: 1; }
/ ===== Upload dropzone ===== /
.dropzone {
border: 1.5px dashed var(--line);
border-radius: 12px; padding: 22px;
text-align: center; color: var(--muted);
font-size: 13px; cursor: pointer;
transition: border-color 0.2s, background 0.2s;
}
.dropzone:hover { border-color: var(--accent); background: rgba(249,115,22,0.04); }
.dropzone strong { color: var(--accent-2); }
/ ===== Submit ===== /
.btn {
width: 100%; margin-top: 8px; padding: 15px;
background: linear-gradient(110deg, var(--accent-dark), var(--accent) 45%, var(--accent-2));
color: #fff; border: none; border-radius: 11px;
font-size: 15px; font-weight: 800; cursor: pointer; letter-spacing: 0.3px;
box-shadow: 0 10px 30px var(--halo);
transition: transform 0.12s, opacity 0.15s;
}
.btn:hover { transform: translateY(-1px); }
.btn:active { transform: scale(0.98); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; box-shadow: none; }
/ ===== Status ===== /
.status {
margin-top: 14px; padding: 13px 15px; border-radius: 10px;
font-size: 13px; display: none; border: 1px solid transparent;
align-items: center; gap: 9px;
}
.status.success { display: flex; background: rgba(34,197,94,0.1); color: var(--green); border-color: rgba(34,197,94,0.3); }
.status.error { display: flex; background: rgba(239,68,68,0.1); color: var(--red); border-color: rgba(239,68,68,0.3); }
.status.loading { display: flex; background: rgba(249,115,22,0.1); color: var(--accent-2); border-color: rgba(249,115,22,0.3); }
.spinner {
width: 14px; height: 14px; border-radius: 50%;
border: 2px solid rgba(249,115,22,0.25); border-top-color: var(--accent-2);
animation: spin 0.7s linear infinite; flex-shrink: 0;
}
keyframes spin { to { transform: rotate(360deg); } }
/ ===== Footer ===== /
.footer {
display: flex; justify-content: space-between; align-items: center;
padding: 13px 22px; font-size: 11.5px; color: var(--muted);
border-top: 1px solid var(--line); background: rgba(0,0,0,0.2);
}
.footer b.on { color: var(--green); font-weight: 600; }
.footer b.v { color: var(--accent); font-weight: 700; }
</style>
</head>
<body>

<!-- Top bar -->

⚡

BulkPoster
<small>Mass Facebook Publisher</small>

Online

<!-- Tabs -->

📤 Đăng bài

ChatGPT:
🗄 Lịch sử

⚙️ Cấu hình

<!-- Body -->

Fanpage đích

<select id="page">
<option value="">— Đang tải danh sách... —</option>
</select>

⟳ Tải lại danh sách

Nội dung đăng *

<textarea class="textarea" id="content" placeholder="Viết nội dung bài đăng tại đây..."></textarea>

Hình ảnh

📁 Kéo thả ảnh hoặc chọn file
<small style="color:#4f5a72">hoặc dán link ảnh bên dưới</small>

<input class="input" type="text" id="image" placeholder="https://... (bỏ trống nếu không cần ảnh)">

Lên lịch <small style="text-transform:none;letter-spacing:0;color:var(--muted)">tùy chọn</small>

<input class="input" type="datetime-local" id="schedule">

<button class="btn" id="submitBtn" onclick="postToFb()">🚀 Đăng bài lên fanpage</button>

<!-- Footer -->

Status: ● Sẵn sàng
BulkPoster v2.0

<script>
const WEBHOOK_LIST = "https://hook.make.com/WEBHOOK-LAY-DANH-SACH";
const WEBHOOK_POST = "https://hook.make.com/WEBHOOK-DANG-BAI";

async function loadPages() {
const select = document.getElementById('page');
select.innerHTML = '<option value="">— Đang tải... —</option>';
try {
const res = await fetch(WEBHOOK_LIST);
const pages = await res.json();
select.innerHTML = '<option value="">— Chọn fanpage —</option>';
if (Array.isArray(pages) && pages.length === 0) {
select.innerHTML = '<option value="">Không có fanpage nào</option>';
}
pages.forEach(p => {
const opt = document.createElement('option');
opt.value = p.id || p.page_id;
opt.textContent = p.name || p.page_name;
select.appendChild(opt);
});
} catch (e) {
console.error('Lỗi tải danh sách:', e);
select.innerHTML = '<option value="">Lỗi tải danh sách</option>';
}
}

async function postToFb() {
const page = document.getElementById('page').value;
const content = document.getElementById('content').value.trim();
const image = document.getElementById('image').value.trim();
const schedule = document.getElementById('schedule').value;
const status = document.getElementById('status');
const btn = document.getElementById('submitBtn');

if (!page) { showStatus('Chưa chọn fanpage!', 'error'); return; }
if (!content) { showStatus('Nội dung chưa có!', 'error'); return; }

btn.disabled = true;
showStatus(schedule ? 'Đang lên lịch đăng...' : 'Đang đăng bài...', 'loading', true);

const payload = {

ChatGPT:
page_id: page,
content: content,
image: image || null,
schedule: schedule || null,
timestamp: new Date().toISOString()
};

try {
const res = await fetch(WEBHOOK_POST, {
method: 'POST',
headers: { 'Content-Type': 'application/json' },
body: JSON.stringify(payload)
});
const result = await res.json().catch(() => ({}));
if (result.error) {
showStatus('Thất bại: ' + result.error, 'error');
} else {
showStatus(schedule ? '✅ Đã lên lịch! Sẽ đăng vào giờ đã chọn.' : '✅ Đã gửi! Make.com đang xử lý đăng bài.', 'success');
document.getElementById('content').value = '';
document.getElementById('image').value = '';
document.getElementById('schedule').value = '';
}
} catch (e) {
showStatus('Lỗi kết nối: ' + e.message, 'error');
} finally {
btn.disabled = false;
}
}

function showStatus(msg, type, loading) {
const el = document.getElementById('status');
el.className = 'status ' + type;
el.innerHTML = (loading ? '
' : '') + msg;
}

window.onload = loadPages;
</script>
</body>
</html>
