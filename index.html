<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dino Social Hub 3.0</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--text:#172033;--muted:#7d8799;--line:#e7ebf2;--blue:#1769ff;--blue2:#0f57db;--green:#16a36a;--red:#e05252;--orange:#e89a25;--shadow:0 8px 28px #24365b0d}
*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:var(--bg);color:var(--text)}
button,input,textarea,select{font:inherit}button{cursor:pointer}.app{display:flex;min-height:100vh}
.sidebar{width:240px;background:#fff;border-right:1px solid var(--line);padding:20px 14px;position:fixed;inset:0 auto 0 0;z-index:5}
.brand{font-size:20px;font-weight:900;padding:4px 12px 24px}.brand span{color:var(--blue)}
.nav{display:grid;gap:5px}.nav button{border:0;background:transparent;text-align:left;padding:11px 12px;border-radius:9px;color:#687286;font-size:13px}.nav button:hover,.nav button.active{background:#edf4ff;color:var(--blue);font-weight:700}
.nav .group{font-size:10px;color:#a3abba;text-transform:uppercase;padding:18px 12px 5px;letter-spacing:.08em}
.main{margin-left:240px;width:calc(100% - 240px)}.topbar{height:64px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 28px;gap:16px;position:sticky;top:0;z-index:4}.crumb{font-weight:800}.search{margin-left:auto;width:280px;border:1px solid var(--line);padding:9px 12px;border-radius:9px;outline:0}.avatar{width:34px;height:34px;border-radius:50%;background:#dce9ff;color:var(--blue);display:grid;place-items:center;font-weight:800}
.content{padding:28px;max-width:1500px;margin:auto}.page-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.page-head h1{margin:0 0 5px;font-size:24px}.page-head p{margin:0;color:var(--muted);font-size:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:13px;box-shadow:var(--shadow)}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}.stat{padding:18px;display:flex;justify-content:space-between}.stat small{color:var(--muted);font-size:11px}.stat h2{margin:8px 0;font-size:25px}.trend{font-size:10px;color:var(--green)}.stat-icon{width:38px;height:38px;border-radius:10px;background:#edf4ff;color:var(--blue);display:grid;place-items:center;font-weight:900}
.primary,.secondary,.danger{border-radius:8px;padding:9px 13px;font-size:11px;border:1px solid var(--line)}.primary{background:var(--blue);color:white;border-color:var(--blue)}.primary:hover{background:var(--blue2)}.secondary{background:#fff;color:#536078}.danger{background:#fff2f2;color:var(--red);border-color:#ffd9d9}
.dashboard-grid{display:grid;grid-template-columns:1.3fr 1fr;gap:18px}.section{padding:18px}.section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.section-head h3{margin:0;font-size:14px}.section-head span{color:var(--blue);font-size:11px;cursor:pointer}
.post-row{display:grid;grid-template-columns:38px 1fr 150px 95px 55px;gap:10px;align-items:center;padding:11px 0;border-top:1px solid #f0f2f6}.thumb{height:38px;border-radius:7px;background:#edf2f8;display:grid;place-items:center;color:#748097}.post-title{font-size:11px;font-weight:700}.post-meta,.schedule-item p{font-size:9px;color:var(--muted);margin:4px 0 0}.platforms{display:flex;gap:4px}.platform{font-style:normal;width:22px;height:22px;border-radius:6px;background:#f0f4fa;display:grid;place-items:center;font-size:11px}.badge{padding:5px 7px;border-radius:20px;font-size:9px}.success{background:#e8f8f0;color:var(--green)}.schedule{background:#fff4df;color:#b87716}.gray{background:#eef1f5;color:#697386}.badge.danger{background:#fff0f0;color:var(--red);border:0}
.schedule-item{display:flex;align-items:center;gap:11px;padding:11px 0;border-top:1px solid #f0f2f6}.date-box{width:40px;height:40px;border-radius:8px;background:#edf4ff;color:var(--blue);display:grid;place-items:center;line-height:12px}.schedule-time{margin-left:auto;font-size:10px;font-weight:800}
.quick{padding:18px}.quick h3{margin:0 0 4px;font-size:14px}.quick p{font-size:10px;color:var(--muted)}.quick-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}
.composer-layout{display:grid;grid-template-columns:1fr 340px;gap:18px}.editor-card,.side-card{padding:20px}.editor-title,.side-title{font-weight:800;font-size:13px;margin-bottom:15px}.editor-tools{display:flex;gap:6px;margin-bottom:12px}.tool,.ai-btn{border:1px solid var(--line);background:#fff;border-radius:7px;padding:7px 10px;font-size:10px}.ai-btn{color:#704cff;background:#f5f1ff;border-color:#e5dcff}.field{margin:12px 0}.field label{display:block;font-size:10px;color:#687286;margin-bottom:6px;font-weight:700}.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);border-radius:8px;padding:9px 10px;outline:0;background:#fff;color:var(--text)}textarea{min-height:140px;resize:vertical}.counter{text-align:right;color:var(--muted);font-size:9px}.upload{margin:16px 0;border:1.5px dashed #cbd6e6;border-radius:10px;padding:22px;text-align:center;color:#6f7b90}.upload-icon{font-size:25px;color:var(--blue)}.upload strong{font-size:11px}.upload p{font-size:9px}.media-preview,.media-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.media-item{height:90px;position:relative}.media-item img{width:100%;height:100%;object-fit:cover;border-radius:8px}.remove-media{position:absolute;right:4px;top:4px;border:0;background:#0009;color:#fff;border-radius:50%;width:21px;height:21px}.platform-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.platform-select{background:#fff;border:1px solid var(--line);border-radius:9px;padding:10px;font-size:10px;color:#536078}.platform-select.selected{border-color:#8eb6ff;background:#f1f6ff;color:var(--blue)}.picon{display:block;font-size:18px;font-weight:800;margin-bottom:4px}.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-top:18px}.tab{border:0;background:#fff;padding:9px 12px;font-size:10px}.tab.active{color:var(--blue);border-bottom:2px solid var(--blue)}.radio{display:flex;gap:8px;font-size:11px;margin:11px 0}.date-time{display:grid;grid-template-columns:1fr 1fr;gap:7px}.status-line{display:flex;justify-content:space-between;border-top:1px solid #f0f2f6;padding:9px 0;font-size:10px}.side-actions{display:grid;gap:8px;margin-top:12px}
.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;font-size:10px}.table th,.table td{padding:13px 8px;border-bottom:1px solid #edf0f4;text-align:left;vertical-align:top}.table th{color:#8a94a6;font-size:9px;text-transform:uppercase}.table td b{font-size:11px}
.calendar{padding:18px}.cal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.cal-head h3{margin:0}.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);border-top:1px solid var(--line);border-left:1px solid var(--line)}.cal-cell{min-height:105px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:8px;font-size:10px}.event{margin-top:7px;background:#eaf2ff;color:var(--blue);border-radius:5px;padding:5px;font-size:8px;cursor:pointer}
.account-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.account{padding:18px}.account-top{display:flex;gap:12px;align-items:center}.social-logo{width:42px;height:42px;border-radius:10px;background:#edf4ff;color:var(--blue);display:grid;place-items:center;font-weight:900;font-size:20px}.account h4{margin:0}.account p{margin:4px 0;color:var(--muted);font-size:10px}.connect{width:100%;margin-top:15px;border:1px dashed #cbd6e6;background:#fafcff;padding:9px;border-radius:8px;font-size:10px;color:var(--blue)}
.media-card{overflow:hidden}.media-image{height:145px;background:#edf1f7;display:grid;place-items:center}.media-info{padding:12px}.media-info strong{font-size:10px}.media-info p{font-size:9px;color:var(--muted)}
.toast{position:fixed;right:24px;bottom:24px;background:#172033;color:#fff;padding:11px 15px;border-radius:9px;font-size:11px;opacity:0;transform:translateY(10px);pointer-events:none;transition:.2s;z-index:20}.toast.show{opacity:1;transform:none}
@media(max-width:1000px){.sidebar{width:190px}.main{margin-left:190px;width:calc(100% - 190px)}.stats{grid-template-columns:repeat(2,1fr)}.composer-layout,.dashboard-grid{grid-template-columns:1fr}.account-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:700px){.sidebar{position:fixed;bottom:auto;width:100%;height:auto;padding:8px;display:flex;overflow:auto}.brand,.nav .group{display:none}.nav{display:flex}.nav button{white-space:nowrap}.main{margin-left:0;margin-top:62px;width:100%}.topbar{display:none}.content{padding:15px}.stats{grid-template-columns:1fr 1fr}.platform-grid{grid-template-columns:repeat(2,1fr)}.account-grid{grid-template-columns:1fr}.post-row{grid-template-columns:34px 1fr}.post-row>div:nth-child(3),.post-row>div:nth-child(4),.post-row>div:nth-child(5){display:none}.media-preview,.media-grid{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar">
  <div class="brand">Dino<span>Social</span></div>
  <div class="nav">
    <div class="group">Tổng quan</div>
    <button data-page="dashboard">▦ Dashboard</button>
    <button data-page="composer">＋ Tạo bài viết</button>
    <button data-page="posts">▤ Bài viết</button>
    <button data-page="calendar">◷ Lịch đăng</button>
    <div class="group">Quản lý</div>
    <button data-page="accounts">◎ Tài khoản Social</button>
    <button data-page="media">▧ Media Library</button>
    <button data-page="analytics">◒ Thống kê</button>
    <button data-page="notifications">♢ Thông báo</button>
    <div class="group">Hệ thống</div>
    <button data-page="settings">⚙ Cài đặt</button>
  </div>
</aside>
<main class="main">
<header class="topbar"><span class="crumb" id="crumb">Dashboard</span><input id="globalSearch" class="search" placeholder="⌕ Tìm bài viết..."><button id="notifyBtn" class="secondary">♢</button><div class="avatar">SD</div></header>
<div class="content" id="app"></div>
</main>
</div>
<div class="toast" id="toast"></div>
<script>
const KEY='dino_social_hub_3';
const PL=[
{id:'facebook',name:'Facebook',icon:'f'},{id:'tiktok',name:'TikTok',icon:'♪'},
{id:'youtube',name:'YouTube',icon:'▶'},{id:'instagram',name:'Instagram',icon:'◎'},{id:'x',name:'X',icon:'𝕏'}];
const seed={posts:[],media:[],accounts:{facebook:[],tiktok:[],youtube:[],instagram:[],x:[]},settings:{name:'Sơn Dino',email:'taynguyenfilm@gmail.com',timezone:'Asia/Ho_Chi_Minh'}};
let db=load(),view='dashboard',composer=blank();
function load(){try{return JSON.parse(localStorage.getItem(KEY))||structuredClone(seed)}catch{return structuredClone(seed)}}
function save(){localStorage.setItem(KEY,JSON.stringify(db))}
function blank(){return{editId:null,title:'',content:'',platforms:['facebook','tiktok'],media:[],schedule:'',mode:'now',pp:{},active:'facebook'}}
function e(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function p(id){return PL.find(x=>x.id===id)}
function fmt(x){return x?new Date(x).toLocaleString('vi-VN',{dateStyle:'short',timeStyle:'short'}):'—'}
function toast(s){let t=document.getElementById('toast');t.textContent=s;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2400)}
function go(v){view=v;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===v));document.getElementById('crumb').textContent=({dashboard:'Dashboard',composer:'Tạo bài viết',posts:'Bài viết',calendar:'Lịch đăng',accounts:'Tài khoản Social',media:'Media Library',analytics:'Thống kê',notifications:'Thông báo',settings:'Cài đặt'})[v];render()}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>go(b.dataset.page));
document.getElementById('notifyBtn').onclick=()=>go('notifications');
document.getElementById('globalSearch').oninput=()=>{if(view!=='posts')go('posts');render()};

function render(){
 const R={dashboard:dashboard,composer:composerView,posts:posts,calendar:calendar,accounts:accounts,media:media,analytics:analytics,notifications:notifications,settings:settings};
 document.getElementById('app').innerHTML=(R[view]||dashboard)();bind();
}
function btn(t,c='secondary',a=''){return `<button class="${c}" data-a="${a}">${t}</button>`}
function dashboard(){
 let total=db.posts.length,pub=db.posts.filter(x=>x.status==='published').length,sch=db.posts.filter(x=>x.status==='scheduled').length,fail=db.posts.filter(x=>x.status==='failed').length;
 let rows=db.posts.slice().sort((a,b)=>b.created-a.created).slice(0,6);
 return `<div class="page-head"><div><h1>Xin chào, ${e(db.settings.name)} 👋</h1><p>Trung tâm quản lý Social Media của bạn.</p></div>${btn('＋ Tạo bài viết','primary','new')}</div>
 <div class="stats">${stat('Tổng bài viết',total,'▤')}${stat('Đã đăng',pub,'✓')}${stat('Đã lên lịch',sch,'◷')}${stat('Thất bại',fail,'!')}</div>
 <div class="card quick"><h3>Tạo nội dung mới</h3><p>Upload một lần, tùy chỉnh theo kênh và quản lý lịch đăng tập trung.</p><div class="quick-actions">${btn('＋ Tạo bài viết','primary','new')}${btn('▧ Media Library','secondary','media')}${btn('◷ Lịch đăng','secondary','calendar')}${btn('⇩ Sao lưu','secondary','export')}</div></div>
 <div class="dashboard-grid" style="margin-top:18px"><div class="card section"><div class="section-head"><h3>Bài viết gần đây</h3><span data-go="posts">Xem tất cả →</span></div>${rows.map(row).join('')||empty()}</div>
 <div class="card section"><div class="section-head"><h3>Sắp đăng</h3><span data-go="calendar">Lịch →</span></div>${db.posts.filter(x=>x.status==='scheduled').sort((a,b)=>new Date(a.schedule)-new Date(b.schedule)).slice(0,5).map(x=>`<div class="schedule-item"><div class="date-box">${new Date(x.schedule).getDate()}</div><div><b style="font-size:10px">${e(x.title)}</b><p>${x.platforms.map(y=>p(y).name).join(' · ')}</p></div><div class="schedule-time">${new Date(x.schedule).toLocaleTimeString('vi-VN',{hour:'2-digit',minute:'2-digit'})}</div></div>`).join('')||empty()}</div></div>`;
}
function stat(l,n,i){return `<div class="card stat"><div><small>${l}</small><h2>${n}</h2><span class="trend">Dữ liệu hiện tại</span></div><div class="stat-icon">${i}</div></div>`}
function row(x){return `<div class="post-row"><div class="thumb">${x.media?.length?'▧':'✎'}</div><div><div class="post-title">${e(x.title)}</div><div class="post-meta">${fmt(x.created)}</div></div><div class="platforms">${x.platforms.map(y=>`<i class="platform">${p(y).icon}</i>`).join('')}</div><div><span class="badge ${x.status==='published'?'success':x.status==='scheduled'?'schedule':x.status==='failed'?'danger':'gray'}">${({published:'Đã đăng',scheduled:'Đã lên lịch',draft:'Bản nháp',failed:'Thất bại'})[x.status]}</span></div>${btn('Sửa','secondary','edit:'+x.id)}</div>`}
function empty(){return `<p style="color:var(--muted);font-size:11px">Chưa có dữ liệu.</p>`}

function composerView(){
 return `<div class="page-head"><div><h1>${composer.editId?'Chỉnh sửa bài viết':'Tạo bài viết'}</h1><p>Tạo một nội dung và phân phối tới nhiều nền tảng.</p></div><div>${btn('Lưu nháp','secondary','draft')} ${btn(composer.mode==='schedule'?'◷ Lên lịch':'🚀 Đăng ngay','primary','publish')}</div></div>
 <div class="composer-layout"><div class="card editor-card"><div class="editor-title">Nội dung</div>
 <div class="editor-tools">${btn('😊 Emoji','tool','emoji')}${btn('# Hashtag','tool','hash')}${btn('⌫ Xóa','tool','clear')}<button class="ai-btn" data-a="ai">✨ AI tạo content</button></div>
 <div class="field"><label>Tiêu đề</label><input id="title" value="${e(composer.title)}" placeholder="Tiêu đề bài viết"></div>
 <div class="field"><label>Nội dung</label><textarea id="content" placeholder="Viết nội dung...">${e(composer.content)}</textarea></div><div class="counter"><span id="count">${composer.content.length}</span> ký tự</div>
 <div class="upload" id="upload">⇧<br><strong>Upload hình ảnh / video</strong><p>JPG, PNG, WEBP, MP4, MOV · tối đa 30MB/file</p></div><input id="files" type="file" multiple accept="image/*,video/*" hidden>
 <div class="media-preview">${composer.media.map((m,i)=>`<div class="media-item"><img src="${m.url}"><button class="remove-media" data-rm="${i}">×</button></div>`).join('')}</div>
 <div class="field"><label>Chọn nền tảng</label><div class="platform-grid">${PL.map(x=>`<button class="platform-select ${composer.platforms.includes(x.id)?'selected':''}" data-pl="${x.id}"><span class="picon">${x.icon}</span>${x.name}</button>`).join('')}</div></div>
 <div class="tabs">${composer.platforms.map(x=>`<button class="tab ${composer.active===x?'active':''}" data-tab="${x}">${p(x).name}</button>`).join('')}</div>
 <div id="pp">${ppFields()}</div></div>
 <div><div class="card side-card"><div class="side-title">Lịch đăng</div><label class="radio"><input type="radio" name="mode" value="now" ${composer.mode==='now'?'checked':''}> Đăng ngay</label><label class="radio"><input type="radio" name="mode" value="schedule" ${composer.mode==='schedule'?'checked':''}> Đặt lịch</label>
 <div class="date-time"><input id="date" type="date" value="${composer.schedule?.slice(0,10)||new Date().toISOString().slice(0,10)}"><input id="time" type="time" value="${composer.schedule?.slice(11,16)||'19:30'}"></div><p style="font-size:9px;color:var(--muted)">Múi giờ: ${db.settings.timezone}</p></div>
 <div class="card side-card"><div class="side-title">Kiểm tra</div>${check('Nền tảng',composer.platforms.length)}${check('Media',composer.media.length)}${check('Nội dung',composer.content.trim()?'✓':'!')}</div>
 <div class="side-actions">${btn('✨ Tối ưu bằng AI','ai-btn','ai')}${btn(composer.mode==='schedule'?'◷ Lên lịch':'🚀 Đăng ngay','primary','publish')}</div></div></div>`
}
function check(a,b){return `<div class="status-line"><span>${a}</span><b>${b}</b></div>`}
function ppFields(){let v=composer.pp[composer.active]||{};if(composer.active==='youtube')return `<div class="field"><label>Tiêu đề YouTube</label><input data-pp="title" value="${e(v.title||composer.title)}"></div><div class="field"><label>Mô tả</label><textarea data-pp="description">${e(v.description||composer.content)}</textarea></div>`;return `<div class="field"><label>Caption ${p(composer.active).name}</label><textarea data-pp="caption">${e(v.caption||composer.content)}</textarea></div><div class="field"><label>Hashtag</label><input data-pp="hashtags" value="${e(v.hashtags||'#DinoSocialHub #SocialMedia')}" ></div>`}

function posts(){
 let q=(document.getElementById('q')?.value||document.getElementById('globalSearch').value||'').toLowerCase(),f=document.getElementById('filter')?.value||'';
 let arr=db.posts.filter(x=>(!q||(x.title+' '+x.content).toLowerCase().includes(q))&&(!f||x.status===f));
 return `<div class="page-head"><div><h1>Bài viết</h1><p>CRUD đầy đủ: tạo, sửa, nhân bản, xóa, tìm kiếm, lọc.</p></div>${btn('＋ Tạo bài viết','primary','new')}</div><div class="card section"><div class="section-head"><div style="display:flex;gap:8px"><input class="search" id="q" value="${e(q)}" placeholder="Tìm bài viết..." style="margin:0;width:240px"><select id="filter" class="secondary"><option value="">Tất cả</option><option value="published">Đã đăng</option><option value="scheduled">Đã lên lịch</option><option value="draft">Bản nháp</option><option value="failed">Thất bại</option></select></div><span>${arr.length} bài</span></div><div class="table-wrap"><table class="table"><thead><tr><th>Nội dung</th><th>Nền tảng</th><th>Thời gian</th><th>Trạng thái</th><th>Thao tác</th></tr></thead><tbody>${arr.map(x=>`<tr><td><b>${e(x.title)}</b><div style="color:var(--muted);margin-top:3px">${e(x.content.slice(0,90))}</div></td><td>${x.platforms.map(y=>p(y).name).join(' · ')}</td><td>${fmt(x.schedule||x.created)}</td><td><span class="badge ${x.status==='published'?'success':x.status==='scheduled'?'schedule':x.status==='failed'?'danger':'gray'}">${({published:'Đã đăng',scheduled:'Đã lên lịch',draft:'Bản nháp',failed:'Thất bại'})[x.status]}</span></td><td>${btn('Sửa','secondary','edit:'+x.id)} ${btn('Copy','secondary','dup:'+x.id)} ${btn('Xóa','danger','del:'+x.id)}</td></tr>`).join('')||`<tr><td colspan="5">${empty()}</td></tr>`}</tbody></table></div></div>`
}
function calendar(){
 let d=new Date(),y=d.getFullYear(),m=d.getMonth(),first=(new Date(y,m,1).getDay()+6)%7,days=new Date(y,m+1,0).getDate(),cells='';
 for(let i=0;i<first;i++)cells+='<div class="cal-cell"></div>';
 for(let day=1;day<=days;day++){let a=db.posts.filter(x=>x.status==='scheduled'&&x.schedule&&new Date(x.schedule).toDateString()===new Date(y,m,day).toDateString());cells+=`<div class="cal-cell"><strong>${day}</strong>${a.map(x=>`<div class="event" data-a="edit:${x.id}">${new Date(x.schedule).toLocaleTimeString('vi-VN',{hour:'2-digit',minute:'2-digit'})} · ${e(x.title.slice(0,20))}</div>`).join('')}</div>`}
 return `<div class="page-head"><div><h1>Lịch đăng</h1><p>Hiển thị lịch từ dữ liệu bài viết đã lên lịch.</p></div>${btn('＋ Tạo bài viết','primary','new')}</div><div class="card calendar"><div class="cal-head"><h3>Tháng ${m+1}, ${y}</h3>${btn('Hôm nay','secondary','today')}</div><div class="cal-grid">${['T2','T3','T4','T5','T6','T7','CN'].map(x=>`<div class="cal-cell" style="min-height:auto;background:#f8fafc"><b>${x}</b></div>`).join('')}${cells}</div></div>`
}
function accounts(){
 return `<div class="page-head"><div><h1>Tài khoản Social</h1><p>Quản lý nhiều tài khoản/kênh. Kết nối API thật sẽ thực hiện ở backend.</p></div>${btn('＋ Thêm tài khoản','primary','addacc')}</div><div class="account-grid">${PL.map(x=>`<div class="card account"><div class="account-top"><div class="social-logo">${x.icon}</div><div><h4>${x.name}</h4><p>${(db.accounts[x.id]||[]).length} tài khoản</p></div></div>${(db.accounts[x.id]||[]).map(a=>`<div style="display:flex;justify-content:space-between;margin-top:13px;font-size:10px"><span>${e(a.name)}</span>${btn(a.connected?'Ngắt kết nối':'Kết nối lại','secondary','toggle:'+x.id+':'+a.id)}</div>`).join('')||empty()}<button class="connect" data-add="${x.id}">＋ Thêm ${x.name}</button></div>`).join('')}</div>`
}
function media(){return `<div class="page-head"><div><h1>Media Library</h1><p>Lưu và quản lý hình/video trên trình duyệt.</p></div>${btn('⇧ Upload Media','primary','mediaUpload')}<input id="mfiles" type="file" multiple accept="image/*,video/*" hidden></div><div class="media-grid">${db.media.map((m,i)=>`<div class="card media-card"><div class="media-image">${m.type.startsWith('image')?`<img src="${m.url}" style="width:100%;height:100%;object-fit:cover">`:'🎬'}</div><div class="media-info"><strong>${e(m.name)}</strong><p>${m.type} · ${Math.round(m.size/1024)} KB</p>${btn('Xóa','danger','mdel:'+i)}</div></div>`).join('')||`<div class="card section" style="grid-column:1/-1">${empty()}</div>`}</div>`}
function analytics(){let total=db.posts.length;return `<div class="page-head"><div><h1>Thống kê</h1><p>Thống kê vận hành nội bộ của Dino Social Hub.</p></div></div><div class="stats">${stat('Tổng bài',total,'▤')}${stat('Media',db.media.length,'▧')}${stat('Tài khoản',Object.values(db.accounts).flat().length,'◎')}${stat('Đã đăng',db.posts.filter(x=>x.status==='published').length,'✓')}</div><div class="card section"><h3>Số bài theo nền tảng</h3>${PL.map(x=>{let n=db.posts.filter(y=>y.platforms.includes(x.id)).length;return `<div style="display:flex;gap:10px;align-items:center;margin:15px 0;font-size:10px"><b style="width:75px">${x.name}</b><div style="flex:1;height:10px;background:#edf2fa;border-radius:20px;overflow:hidden"><div style="height:100%;width:${total?Math.max(3,n/total*100):0}%;background:var(--blue)"></div></div><span>${n}</span></div>`}).join('')}</div>`}
function notifications(){let fail=db.posts.filter(x=>x.status==='failed');return `<div class="page-head"><div><h1>Thông báo</h1><p>Sự kiện và lỗi cần xử lý.</p></div>${btn('Đánh dấu đã đọc','secondary','read')}</div><div class="card section"><div class="schedule-item"><div class="date-box">✓</div><div><b style="font-size:10px">Dino Social Hub đang hoạt động</b><p>Dữ liệu localStorage được lưu trên thiết bị này.</p></div></div>${fail.map(x=>`<div class="schedule-item"><div class="date-box">!</div><div><b style="font-size:10px">Bài đăng thất bại: ${e(x.title)}</b><p>Kiểm tra kết nối API và thử lại.</p></div></div>`).join('')}</div>`}
function settings(){return `<div class="page-head"><div><h1>Cài đặt</h1><p>Hồ sơ, dữ liệu và cấu hình ứng dụng.</p></div></div><div class="card section" style="max-width:800px"><div class="field"><label>Tên hiển thị</label><input id="sn" value="${e(db.settings.name)}"></div><div class="field"><label>Email</label><input id="se" value="${e(db.settings.email)}"></div><div class="field"><label>Múi giờ</label><select id="st"><option>Asia/Ho_Chi_Minh</option><option>Asia/Bangkok</option><option>UTC</option></select></div>${btn('Lưu cài đặt','primary','saveSettings')} ${btn('⇩ Export JSON','secondary','export')} ${btn('⇧ Import JSON','secondary','import')} ${btn('↺ Reset demo','danger','reset')}<input id="json" type="file" accept=".json" hidden><div style="margin-top:18px;padding:12px;background:#fff8e8;border-radius:9px;font-size:10px;color:#7b6329"><b>Giai đoạn 3.0:</b> Đây là bản web frontend/local-first. CRUD, media, lịch, tài khoản, dashboard và dữ liệu đã hoạt động. Đăng thật lên Facebook/TikTok/YouTube/Instagram/X cần backend OAuth/API.</div></div>`}

function bind(){
 document.querySelectorAll('[data-a]').forEach(x=>x.onclick=()=>action(x.dataset.a));
 document.querySelectorAll('[data-go]').forEach(x=>x.onclick=()=>go(x.dataset.go));
 document.querySelectorAll('[data-pl]').forEach(x=>x.onclick=()=>{let id=x.dataset.pl;if(composer.platforms.includes(id)){if(composer.platforms.length>1)composer.platforms=composer.platforms.filter(a=>a!==id)}else composer.platforms.push(id);if(!composer.platforms.includes(composer.active))composer.active=composer.platforms[0];render()});
 document.querySelectorAll('[data-tab]').forEach(x=>x.onclick=()=>{composer.active=x.dataset.tab;render()});
 document.querySelectorAll('[data-rm]').forEach(x=>x.onclick=()=>{composer.media.splice(+x.dataset.rm,1);render()});
 let c=document.getElementById('content');if(c)c.oninput=()=>{composer.content=c.value;document.getElementById('count').textContent=c.value.length};
 let t=document.getElementById('title');if(t)t.oninput=()=>composer.title=t.value;
 document.querySelectorAll('input[name=mode]').forEach(x=>x.onchange=()=>{composer.mode=x.value;render()});
 document.querySelectorAll('[data-pp]').forEach(x=>x.oninput=()=>{composer.pp[composer.active]??={};composer.pp[composer.active][x.dataset.pp]=x.value});
 let up=document.getElementById('upload');if(up)up.onclick=()=>document.getElementById('files').click();
 let fs=document.getElementById('files');if(fs)fs.onchange=ev=>read(ev.target.files,true);
 let mf=document.getElementById('mfiles');if(mf)mf.onchange=ev=>read(ev.target.files,false);
 let q=document.getElementById('q');if(q)q.oninput=()=>render();
 let f=document.getElementById('filter');if(f)f.onchange=()=>render();
 document.querySelectorAll('[data-add]').forEach(x=>x.onclick=()=>addAccount(x.dataset.add));
}
function action(a){
 if(a==='new'){composer=blank();go('composer')}
 else if(a==='publish'||a==='draft')savePost(a==='draft'?'draft':composer.mode==='schedule'?'scheduled':'published');
 else if(a==='emoji'){composer.content+=' 😊';render()}
 else if(a==='hash'){composer.content+=(composer.content?' ':'')+'#DinoSocialHub #SocialMedia #ContentMarketing';render()}
 else if(a==='clear'){composer.content='';render()}
 else if(a==='ai'){composer.content='🔥 '+(composer.title||'Nội dung mới')+'\\n\\nMột nội dung – nhiều nền tảng – tiết kiệm thời gian vận hành.\\n\\n✅ Upload hình/video một lần\\n✅ Tùy chỉnh từng kênh\\n✅ Lên lịch tự động\\n✅ Quản lý nhiều tài khoản\\n\\n#DinoSocialHub #SocialMedia';render();toast('✨ Đã tạo content mẫu')}
 else if(a==='media')go('media');
 else if(a==='calendar')go('calendar');
 else if(a==='posts')go('posts');
 else if(a==='export')exportData();
 else if(a==='import')document.getElementById('json').click();
 else if(a==='reset'){if(confirm('Reset dữ liệu?')){db=structuredClone(seed);save();render();toast('Đã reset')}}
 else if(a==='saveSettings'){db.settings.name=document.getElementById('sn').value;db.settings.email=document.getElementById('se').value;db.settings.timezone=document.getElementById('st').value;save();toast('✓ Đã lưu')}
 else if(a.startsWith('edit:'))edit(a.slice(5));
 else if(a.startsWith('del:'))del(a.slice(4));
 else if(a.startsWith('dup:'))dup(a.slice(4));
 else if(a.startsWith('mdel:')){db.media.splice(+a.slice(5),1);save();render()}
 else if(a.startsWith('toggle:')){let [pid,id]=a.slice(7).split(':');let z=db.accounts[pid].find(x=>x.id===id);z.connected=!z.connected;save();render()}
 else if(a==='addacc')addAccount('facebook');
 else if(a==='today')render();
 else if(a==='mediaUpload')document.getElementById('mfiles').click();
 else if(a==='read')toast('✓ Đã đánh dấu đã đọc');
}
function savePost(status){
 if(!composer.content.trim())return toast('⚠ Nhập nội dung trước');
 let date=document.getElementById('date')?.value,time=document.getElementById('time')?.value,schedule=composer.mode==='schedule'?date+'T'+time:'';
 let obj={id:composer.editId||crypto.randomUUID(),title:composer.title||composer.content.slice(0,55),content:composer.content,platforms:[...composer.platforms],media:[...composer.media],schedule,status,created:Date.now(),pp:composer.pp};
 if(composer.editId){let i=db.posts.findIndex(x=>x.id===composer.editId);db.posts[i]=obj}else db.posts.push(obj);save();toast(status==='scheduled'?'📅 Đã lên lịch':'✓ Đã lưu bài viết');go('posts')
}
function edit(id){let x=db.posts.find(x=>x.id===id);composer={editId:id,title:x.title,content:x.content,platforms:[...x.platforms],media:x.media||[],schedule:x.schedule||'',mode:x.status==='scheduled'?'schedule':'now',pp:x.pp||{},active:x.platforms[0]};go('composer')}
function del(id){if(confirm('Xóa bài viết này?')){db.posts=db.posts.filter(x=>x.id!==id);save();render()}}
function dup(id){let x=db.posts.find(x=>x.id===id);db.posts.push({...structuredClone(x),id:crypto.randomUUID(),title:x.title+' (Copy)',status:'draft',schedule:'',created:Date.now()});save();render();toast('✓ Đã nhân bản')}
function addAccount(pid){let name=prompt('Tên tài khoản/kênh '+p(pid).name+':');if(name){db.accounts[pid].push({id:crypto.randomUUID(),name,connected:true});save();render();toast('✓ Đã thêm tài khoản')}}
function read(files,forComposer){[...files].forEach(file=>{if(file.size>30*1024*1024)return toast('File quá lớn');let r=new FileReader();r.onload=()=>{let m={name:file.name,type:file.type,size:file.size,url:r.result};if(forComposer)composer.media.push(m);else db.media.push(m);save();render()};r.readAsDataURL(file)})}
function exportData(){let b=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='dino-social-hub-backup.json';a.click()}
document.addEventListener('change',ev=>{if(ev.target.id==='json'&&ev.target.files[0]){let r=new FileReader();r.onload=()=>{try{db=JSON.parse(r.result);save();render();toast('✓ Import thành công')}catch{toast('File JSON không hợp lệ')}};r.readAsText(ev.target.files[0])}});
render();
</script>
</body></html>
