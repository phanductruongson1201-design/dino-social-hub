<script>
/* Local icon renderer - FIXED SVG SCALING BUG */
window.lucide = window.lucide || {};
window.lucide.createIcons = function(){
  const icons = {
    'layers-3':'<path d="M12 2 2.5 7 12 12l9.5-5L12 2Z"/><path d="m2.5 12 9.5 5 9.5-5"/><path d="m2.5 17 9.5 5 9.5-5"/>',

    'calendar-days':'<rect x="3" y="4" width="18" height="17" rx="2"/><path d="M16 2v4M8 2v4M3 10h18M8 14h.01M12 14h.01M16 14h.01M8 18h.01M12 18h.01"/>',
    'link-2':'<path d="M10 13a5 5 0 0 0 7.1.1l2-2a5 5 0 0 0-7.1-7.1l-1.1 1.1"/><path d="M14 11a5 5 0 0 0-7.1-.1l-2 2A5 5 0 0 0 12 20l1.1-1.1"/>',
    'images':'<rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/>',
    'upload-cloud':'<path d="M16 16l-4-4-4 4"/><path d="M12 12v9"/><path d="M20.4 16.4A5 5 0 0 0 18 7h-1.3A7 7 0 0 0 3 10.5 4.5 4.5 0 0 0 7.5 15H8"/>',
    'list-checks':'<path d="M9 6h12M9 12h12M9 18h12"/><path d="m3 6 1 1 2-2M3 12l1 1 2-2M3 18l1 1 2-2"/>',
    'users':'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>',
    'chart-no-axes-combined':'<path d="M3 3v18h18"/><path d="m7 16 4-5 3 3 5-7"/>',
    'bell':'<path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/><path d="M10 21h4"/>',
    'settings-2':'<path d="M3 6h7M14 6h7M3 12h2M9 12h12M3 18h7M14 18h7"/><circle cx="12" cy="6" r="2"/><circle cx="7" cy="12" r="2"/><circle cx="12" cy="18" r="2"/>',
    'panel-left-close':'<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18M14 9l-3 3 3 3"/>',
    'search':'<circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/>',
    'circle-help':'<circle cx="12" cy="12" r="9"/><path d="M9.8 9a2.4 2.4 0 1 1 4.4 1.3c-.8.9-2.2 1.2-2.2 2.7"/><path d="M12 17h.01"/>',
    'chevron-right':'<path d="m9 18 6-6-6-6"/>',

    'check-circle-2':'<circle cx="12" cy="12" r="9"/><path d="m8 12 2.5 2.5L16 9"/>',
    'circle':'<circle cx="12" cy="12" r="9"/>',
    'eye':'<path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"/><circle cx="12" cy="12" r="2.5"/>',
    'file':'<path d="M6 2h8l4 4v16H6a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2Z"/><path d="M14 2v5h5"/>',
    'file-text':'<path d="M6 2h8l4 4v16H6a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2Z"/><path d="M14 2v5h5M8 11h8M8 15h8M8 19h5"/>',
    'home':'<path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1Z"/><path d="M9 21v-6h6v6"/>',
    'download':'<path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/>',
    'upload':'<path d="M12 16V4"/><path d="m7 9 5-5 5 5"/><path d="M5 20h14"/>',
    'cloud-upload':'<path d="M16 16l-4-4-4 4"/><path d="M12 12v9"/><path d="M20 16a4 4 0 0 0-3.6-4A6 6 0 0 0 5 9a4 4 0 0 0 0 8h2"/>',
    'save':'<path d="M5 3h12l3 3v15H4V3Z"/><path d="M8 3v6h8V3M8 21v-7h8v7"/>',
    'send':'<path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/>',
    'sparkles':'<path d="m12 3 1.5 4.5L18 9l-4.5 1.5L12 15l-1.5-4.5L6 9l4.5-1.5Z"/><path d="m19 15 .8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8Z"/>',
    'calendar-clock':'<path d="M3 4h14a2 2 0 0 1 2 2v7"/><path d="M3 10h16M7 2v4M13 2v4"/><path d="M3 17a4 4 0 1 0 8 0 4 4 0 0 0-8 0Z"/><path d="M7 15v2l1.5 1"/>',
    'refresh-cw':'<path d="M20 11a8 8 0 0 0-14.9-3"/><path d="M4 4v5h5"/><path d="M4 13a8 8 0 0 0 14.9 3"/><path d="M20 20v-5h-5"/>',
    'plug-zap':'<path d="m13 2-2 7h4l-2 7"/><path d="M7 7H5a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h2M17 7h2a2 2 0 0 1 2 2v6a2 2 0 0 1-2 2h-2"/>',
    'shield':'<path d="M12 3 20 6v6c0 5-3.4 8-8 10-4.6-2-8-5-8-10V6Z"/>',
    'shield-check':'<path d="M12 3 20 6v6c0 5-3.4 8-8 10-4.6-2-8-5-8-10V6Z"/><path d="m8.5 12 2.2 2.2 4.8-5"/>',
    'user-plus':'<circle cx="9" cy="8" r="4"/><path d="M3 21v-1a6 6 0 0 1 12 0v1M19 8v6M16 11h6"/>',
    'inbox':'<path d="M4 5h16l1 10-3 4H6l-3-4Z"/><path d="M3 14h5l1 2h6l1-2h5"/>',
    'list':'<path d="M8 6h13M8 12h13M8 18h13"/><path d="M3 6h.01M3 12h.01M3 18h.01"/>',
    'play':'<path d="m8 5 11 7-11 7Z"/>',
    'image':'<rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/>',
    'video':'<rect x="3" y="5" width="15" height="14" rx="2"/><path d="m18 10 4-3v10l-4-3"/>',
    'broom':'<path d="m3 16 8-8 4 4-8 8H3Z"/><path d="m13 6 3-3 5 5-3 3M5 20h10"/>',
    'badge-x':'<circle cx="12" cy="12" r="9"/><path d="m9 9 6 6M15 9l-6 6"/>'
  };
  document.querySelectorAll('i[data-lucide]').forEach(function(i){
    if(i.dataset.iconReady) return;
    const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');
    const name=i.getAttribute('data-lucide');
    svg.setAttribute('viewBox','0 0 24 24');
    svg.setAttribute('fill','none');
    svg.setAttribute('stroke','currentColor');
    svg.setAttribute('stroke-width','1.8');
    svg.setAttribute('stroke-linecap','round');
    svg.setAttribute('stroke-linejoin','round');
    
    // BỔ SUNG: Khóa cứng thuộc tính width/height để chống lỗi tràn viền khổng lồ
    svg.setAttribute('width','24');
    svg.setAttribute('height','24');
    
    const existingClass = i.getAttribute('class') || '';
    svg.setAttribute('class', `lucide lucide-${name} ${existingClass}`.trim());
    
    if(i.getAttribute('style')) svg.setAttribute('style',i.getAttribute('style'));
    svg.setAttribute('aria-hidden','true');
    svg.innerHTML=icons[name] || icons['circle'];
    i.dataset.iconReady='1';
    i.replaceWith(svg);
  });
};
</script>
<style>
/* CSS Variables & Reset */
:root {
  --bg:#f6f8fb; --surface:#fff; --surface-2:#f9fafb; --line:#e5e7eb; --line-2:#eef0f3;
  --text:#172033; --muted:#667085; --primary:#2563eb; --primary-2:#1d4ed8; --primary-soft:#eff6ff;
  --success:#16a34a; --success-soft:#ecfdf3; --warning:#d97706; --warning-soft:#fffbeb;
  --danger:#dc2626; --danger-soft:#fef2f2; --info:#0f766e; --info-soft:#ecfeff;
  --shadow:0 4px 18px rgba(15,23,42,.045); --sidebar:196px; --radius:7px;
}
* { box-sizing:border-box }
html { font-size:13px; overflow-x:hidden }
body { margin:0; padding:0; font-family:Inter,ui-sans-serif,system-ui,sans-serif; color:var(--text); background:var(--bg); font-size:12px; line-height:1.4; overflow-x:hidden; min-height:100vh }
button, input, select, textarea { font:inherit }

/* BỔ SUNG FIX LỖI: Sizing cố định cho toàn bộ SVG */
svg.lucide { width: 1.2em; height: 1.2em; vertical-align: middle; flex-shrink: 0; }
.nav-item svg { width: 15px; height: 15px; flex: 0 0 auto; }
.search svg { position: absolute; left: 10px; top: 8px; width: 15px; height: 15px; color: #98a2b3; }
.quick svg { width: 14px; height: 14px; color: var(--primary); }
.empty svg { width: 30px; height: 30px; margin-bottom: 8px; color:#98a2b3; }
.collapse-btn svg { width: 14px; height: 14px; }
.icon-btn svg { width: 16px; height: 16px; }
.btn svg { width: 14px; height: 14px; }
.stat-icon svg { width: 16px; height: 16px; }
.logo svg { width: 18px; height: 18px; }

/* Layout */
.app { display:flex; min-height:100vh }
.sidebar { width:var(--sidebar); background:#fff; border-right:1px solid var(--line); position:fixed; inset:0 auto 0 0; z-index:30; display:flex; flex-direction:column; transition:.2s }
.sidebar.collapsed { width:58px }
.sidebar.collapsed .brand-name, .sidebar.collapsed .brand-version, .sidebar.collapsed .section-label, .sidebar.collapsed .nav-label, .sidebar.collapsed .user-meta, .sidebar.collapsed .collapse-text, .sidebar.collapsed .demo-badge { display:none }
.sidebar.collapsed .brand { justify-content:center; padding:0 8px }
.sidebar.collapsed .nav-item { justify-content:center; padding-left:8px; padding-right:8px }

.main { margin-left:var(--sidebar); width:calc(100% - var(--sidebar)); transition:.2s }
.sidebar.collapsed ~ .main { margin-left:58px; width:calc(100% - 58px) }

/* Topbar & Sidebar details */
.brand { height:52px; padding:0 10px; gap:8px; display:flex; align-items:center; border-bottom:1px solid var(--line-2) }
.logo { width:29px; height:29px; border-radius:8px; background:linear-gradient(145deg,#2563eb,#3b82f6); color:#fff; display:grid; place-items:center; box-shadow:0 8px 18px rgba(37,99,235,.2) }
.brand-name { font-size:12px; font-weight:800; letter-spacing:-.02em }
.brand-version { font-size:9px; color:var(--muted); margin-top:1px }
.nav { padding:6px 6px; overflow:auto }
.section-label { font-size:7.5px; font-weight:800; letter-spacing:.1em; color:#98a2b3; padding:8px 8px 5px }
.nav-item { width:100%; border:0; background:transparent; color:#475467; padding:6px 8px; border-radius:8px; display:flex; align-items:center; gap:7px; text-align:left; cursor:pointer; font-size:10px; margin-bottom:1px }
.nav-item:hover { background:#f7f9fc; color:var(--text) }
.nav-item.active { background:var(--primary-soft); color:var(--primary); font-weight:700 }
.sidebar-footer { margin-top:auto; border-top:1px solid var(--line-2); padding:8px }
.demo-badge { background:var(--warning-soft); border:1px solid #fde68a; color:#92400e; padding:7px 8px; border-radius:7px; font-size:9px; line-height:1.35 }
.collapse-btn { margin-top:7px; width:100%; border:1px solid var(--line); background:#fff; color:#475467; padding:7px; border-radius:7px; display:flex; align-items:center; justify-content:center; gap:7px; cursor:pointer; font-size:9px }

.topbar { height:52px; background:rgba(255,255,255,.94); backdrop-filter:blur(12px); border-bottom:1px solid var(--line); display:flex; align-items:center; padding:0 12px; gap:8px; position:sticky; top:0; z-index:20 }
.breadcrumbs { font-size:11px; color:var(--muted); display:flex; align-items:center; gap:5px; white-space:nowrap }
.breadcrumbs b { color:var(--text) }
.search { position:relative; max-width:340px; flex:1; margin-left:auto }
.search input { width:100%; height:31px; border:1px solid var(--line); border-radius:8px; padding:0 10px 0 32px; outline:none; background:#fff; font-size:11px }
.search input:focus, .input:focus, .textarea:focus, .select:focus { border-color:#93c5fd; box-shadow:0 0 0 3px rgba(37,99,235,.08) }
.top-actions { display:flex; gap:5px; align-items:center }
.icon-btn { width:31px; height:31px; border:1px solid var(--line); background:#fff; border-radius:8px; display:grid; place-items:center; color:#475467; cursor:pointer; position:relative }
.icon-btn:hover { background:#f8fafc }
.notif-dot { width:7px; height:7px; border-radius:50%; background:var(--danger); position:absolute; right:6px; top:6px; border:2px solid #fff }
.avatar { width:27px; height:27px; border-radius:50%; background:#e0ecff; color:#1d4ed8; display:grid; place-items:center; font-size:10px; font-weight:800 }
.user-btn { border:1px solid var(--line); background:#fff; padding:2px 5px 2px 2px; border-radius:8px; display:flex; align-items:center; gap:6px; cursor:pointer }
.user-btn span { font-size:10px; font-weight:700 }

/* Content structure */
.content { padding:11px 13px; max-width:1280px; margin:auto }
.page-header { display:flex; justify-content:space-between; gap:8px; align-items:flex-start; margin-bottom:9px }
.page-title { margin:0; font-size:16px; letter-spacing:-.03em }
.page-subtitle { color:var(--muted); font-size:10px; margin-top:2px }
.actions { display:flex; gap:5px; flex-wrap:wrap }
.btn { height:29px; border:1px solid var(--line); background:#fff; color:#344054; border-radius:7px; padding:0 9px; font-size:9.5px; font-weight:700; display:inline-flex; align-items:center; justify-content:center; gap:5px; cursor:pointer }
.btn:hover { background:#f8fafc }
.btn.primary { background:var(--primary); color:#fff; border-color:var(--primary) }
.btn.primary:hover { background:var(--primary-2) }
.btn.danger { background:#fff; color:var(--danger); border-color:#fecaca }
.btn.success { background:var(--success); color:#fff; border-color:var(--success) }
.btn.small { height:26px; padding:0 7px; font-size:9px }
.btn:disabled { opacity:.55; cursor:not-allowed }
.card { background:#fff; border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow) }
.card-pad { padding:10px }
.grid { display:grid; gap:7px }
.grid-8 { grid-template-columns:repeat(8,minmax(0,1fr)); gap:7px }

/* Data Visualization */
.stat-card { padding:8px; min-height:74px }
.stat-top { display:flex; justify-content:space-between; align-items:center }
.stat-icon { width:24px; height:24px; border-radius:7px; display:grid; place-items:center; background:var(--primary-soft); color:var(--primary) }
.stat-label { font-size:8px; color:var(--muted); font-weight:700 }
.stat-value { font-size:15px; font-weight:800; letter-spacing:-.02em; margin-top:4px }
.stat-foot { font-size:8px; color:var(--muted); margin-top:2px }
.pill { display:inline-flex; align-items:center; gap:4px; padding:3px 6px; border-radius:999px; font-size:8.5px; font-weight:800; border:1px solid transparent; white-space:nowrap }
.dot { width:5px; height:5px; border-radius:50%; background:currentColor }
.pill.success { background:var(--success-soft); color:var(--success); border-color:#bbf7d0 }
.pill.warning { background:var(--warning-soft); color:var(--warning); border-color:#fde68a }
.pill.danger { background:var(--danger-soft); color:var(--danger); border-color:#fecaca }
.pill.info { background:var(--info-soft); color:var(--info); border-color:#a5f3fc }
.pill.neutral { background:#f2f4f7; color:#667085; border-color:#e4e7ec }

.section-title { font-size:11px; font-weight:800 }
.muted { color:var(--muted) }
.two-col { display:grid; grid-template-columns:1.7fr 1fr; gap:7px; margin-top:7px }
.three-col { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:7px; margin-top:7px }
.quick-grid { display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:6px; margin-top:6px }
.quick { border:1px solid var(--line); background:#fff; border-radius:7px; padding:7px; display:flex; align-items:center; gap:7px; cursor:pointer; text-align:left }
.quick:hover { background:#f8fafc }
.quick span { font-size:8.8px; font-weight:800 }

.chart { height:165px; padding:9px 11px 8px }
.chart svg { width:100%; height:100% }
.chart-kpis { display:flex; gap:10px; flex-wrap:wrap; margin-top:7px }
.legend { display:flex; align-items:center; gap:6px; font-size:8.5px; color:var(--muted) }
.legend .swatch { width:7px; height:7px; border-radius:2px; background:var(--primary) }
.donut { width:112px; height:112px; border-radius:50%; background:conic-gradient(#2563eb 0 36%,#14b8a6 36% 62%,#f59e0b 62% 78%,#a855f7 78% 90%,#64748b 90% 100%); position:relative; margin:auto }
.donut:after { content:""; position:absolute; inset:25px; border-radius:50%; background:#fff; border:1px solid var(--line) }
.donut-center { position:absolute; inset:0; display:grid; place-items:center; font-size:12px; font-weight:800; z-index:2 }

.timeline { display:flex; flex-direction:column; gap:7px }
.timeline-item { display:flex; gap:8px }
.timeline-dot { width:7px; height:7px; border-radius:50%; background:var(--primary); margin-top:4px; flex:none }
.timeline-item b { font-size:9.5px }
.timeline-item span { font-size:8.5px; color:var(--muted); display:block; margin-top:2px }

/* Tables */
.table-wrap { overflow:auto }
.table { width:100%; border-collapse:collapse; min-width:690px }
.table th { text-align:left; font-size:7.5px; letter-spacing:.03em; color:#98a2b3; text-transform:uppercase; padding:7px 8px; border-bottom:1px solid var(--line); background:#fbfcfe }
.table td { padding:7px 8px; border-bottom:1px solid var(--line-2); font-size:9.5px; line-height:1.2; vertical-align:middle }
.table tr:hover td { background:#fcfdff }

/* Media & Form Elements */
.thumb { width:34px; height:28px; border-radius:7px; border:1px solid var(--line); background:#f1f5f9; display:grid; place-items:center; overflow:hidden }
.thumb img, .thumb video { width:100%; height:100%; object-fit:cover }
.media-cell { display:flex; align-items:center; gap:7px; min-width:180px }
.media-cell b { font-size:10px }
.subline { font-size:8px; color:var(--muted); margin-top:3px }
.platforms { display:flex; gap:4px; flex-wrap:wrap }
.platform-badge { display:inline-flex; align-items:center; gap:4px; padding:2px 5px; border-radius:6px; background:#f8fafc; border:1px solid var(--line); font-size:8px; font-weight:800 }
.fb { color:#1877f2 } .tt { color:#111827 } .yt { color:#ef4444 } .ig { color:#c026d3 } .xx { color:#111 }

.form-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:7px }
.field { display:flex; flex-direction:column; gap:4px }
.field.full { grid-column:1/-1 }
.label { font-size:9px; font-weight:800; color:#344054 }
.input, .select, .textarea { width:100%; border:1px solid var(--line); border-radius:6px; background:#fff; padding:6px 8px; font:inherit; font-size:10px; outline:none }
.textarea { min-height:78px; resize:vertical }
.editor { min-height:112px }
.help { font-size:8px; color:#98a2b3 }

/* Custom Drag Drop */
.dropzone { border:1.5px dashed #bfd2ea; border-radius:7px; background:#fbfdff; padding:11px; text-align:center; cursor:pointer }
.dropzone:hover { background:#f7fbff; border-color:#93c5fd }
.media-preview { display:grid; grid-template-columns:repeat(auto-fill,minmax(115px,1fr)); gap:6px; margin-top:8px }
.media-item { border:1px solid var(--line); border-radius:10px; overflow:hidden; background:#fff; cursor:move }
.media-item.drag-over { border-color:#2563eb; opacity:0.6 }
.media-preview-box { height:72px; background:#f2f4f7; display:grid; place-items:center; overflow:hidden; position:relative }
.media-preview-box img, .media-preview-box video { width:100%; height:100%; object-fit:cover }
.media-footer { padding:6px 7px }
.drag-hint { font-size:8px; color:#98a2b3 }
.remove-media { position:absolute; right:6px; top:6px }

.platform-selector { display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:5px; margin-bottom:8px }
.platform-card { border:1px solid var(--line); background:#fff; border-radius:7px; padding:7px; cursor:pointer }
.platform-card.selected { border-color:#93c5fd; background:var(--primary-soft) }
.platform-card input { display:none }
.platform-card .p-head { display:flex; justify-content:space-between; align-items:center }
.platform-card b { font-size:9px }
.platform-card small { font-size:7px; color:var(--muted); display:block; margin-top:4px }

.tabs { display:flex; gap:3px; flex-wrap:wrap; border-bottom:1px solid var(--line); padding-bottom:5px; margin-bottom:8px }
.tab { border:1px solid transparent; background:transparent; padding:6px 7px; border-radius:6px; font-size:8.5px; font-weight:800; color:#667085; cursor:pointer }

.modal-backdrop { position:fixed; inset:0; background:rgba(15,23,42,.42); z-index:100; display:none; align-items:center; justify-content:center; padding:18px }

.toast.warning { border-left-color:var(--warning) }

.loading { position:fixed; inset:0; background:rgba(255,255,255,.72); backdrop-filter:blur(3px); display:none; z-index:300; align-items:center; justify-content:center }

  function fmtDate(v, withTime=true) {
    if(!v) return '—'; 
    const d = new Date(v); 
    if(Number.isNaN(d.getTime())) return v; 
    return new Intl.DateTimeFormat('vi-VN', {
      day:'2-digit', month:'2-digit', year:'numeric', 
      hour:withTime?'2-digit':undefined, minute:withTime?'2-digit':undefined
    }).format(d)
  }
  function escape(s='') { 
    return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m])) 
  }
  function statusPill(status) {
    const map = {
      Published:'success', Scheduled:'info', Queued:'warning', Publishing:'info', 
      Failed:'danger', Cancelled:'neutral', Draft:'neutral', Waiting:'warning', 
      Processing:'info', Success:'success', Retrying:'warning', 'Authentication Required':'danger', 
      Uploading:'warning', Uploaded:'info', Ready:'success'
    }; 
    const c = map[status] || 'neutral'; 
    return `<span class="pill ${c}"><span class="dot"></span>${escape(status)}</span>`;
  }

  function renderSchedule() {
    const d = new Date(calendarSelectedDate+'T12:00:00');
    const y = d.getFullYear(), m = d.getMonth();
    let start = new Date(y, m, 1);
    let end = new Date(y, m+1, 0);
    let cells = [];
    
    for(let i=0; i<start.getDay(); i++) cells.push({date: new Date(y, m, -i), muted: true});
    cells = cells.reverse();
    let total = Math.ceil((cells.length + end.getDate()) / 7) * 7;
    for(let day=1; day<=end.getDate(); day++) cells.push({date: new Date(y, m, day), muted: false});
    while(cells.length < total) { cells.push({date: new Date(y, m+1, cells.length - end.getDate() + 1), muted: true}); }
    
    const byDay = {};
    state.posts.filter(p => p.schedule).forEach(p => {
      const key = p.schedule.slice(0,10);
      (byDay[key] || (byDay[key]=[])).push(p);
    });
    
    let html = pageShell('Lịch đăng', 'Calendar Month / Week / Day cho toàn bộ nội dung.', `<button class="btn" id="todayCal">Hôm nay</button><button class="btn primary" data-page="create"><i data-lucide="plus"></i>Đặt lịch</button>`);
    html += `<div class="card card-pad">
      <div class="split">
        <div class="calendar-toolbar"><button class="btn small" id="prevMonth"><i data-lucide="chevron-left"></i></button><b style="font-size:13px">${d.toLocaleDateString('vi-VN',{month:'long',year:'numeric'})}</b><button class="btn small" id="nextMonth"><i data-lucide="chevron-right"></i></button></div>
        <div class="actions"><button class="tab ${state.calendarMode==='Month'?'active':''}" data-cal-mode="Month">Month</button><button class="tab ${state.calendarMode==='Week'?'active':''}" data-cal-mode="Week">Week</button><button class="tab ${state.calendarMode==='Day'?'active':''}" data-cal-mode="Day">Day</button></div>
      </div>`;
      
    if(state.calendarMode === 'Month') {
      html += `<div class="cal-grid" style="margin-top:14px"><div class="cal-head">Sun</div><div class="cal-head">Mon</div><div class="cal-head">Tue</div><div class="cal-head">Wed</div><div class="cal-head">Thu</div><div class="cal-head">Fri</div><div class="cal-head">Sat</div>
        ${cells.map(c => {
          const key = c.date.toISOString().slice(0,10);
          const events = (byDay[key] || []);
          return `<div class="cal-cell ${c.muted?'muted-day':''}" data-cal-cell="${key}"><div class="day-num">${c.date.getDate()}</div>
            ${events.slice(0,4).map(p => `<div class="event ${p.status==='Failed'?'failed':p.status==='Published'?'published':''}" draggable="true" data-cal-post="${p.id}" title="Kéo sang ngày khác để đổi lịch"><b>${fmtDate(p.schedule).split(',')[1]?.trim()||p.schedule.slice(11,16)} · ${escape(p.title)}</b><span>${Object.keys(p.platforms||{})[0]||'—'} · ${statusTextAccount(p)}</span></div>`).join('')}
            ${events.length > 4 ? `<div class="help">+${events.length-4} more</div>` : ''}</div>`
        }).join('')}</div>`;
    } else {
      html += renderWeekDayCalendar(d, byDay);
    }
    html += `</div>`;
    return html;
  }
  
  function statusTextAccount(p) {
    const first = Object.keys(p.platforms || {})[0];
    const acc = state.accounts.find(a => a.platform === first && a.status === 'Connected');
    return acc ? acc.username : 'Demo account';
  }
  
  function renderWeekDayCalendar(anchor, byDay) {
    const base = new Date(anchor);
    let days = [];
    if(state.calendarMode === 'Day') days = [base];
    else {
      const sunday = new Date(base);
      sunday.setDate(base.getDate() - base.getDay());
      for(let i=0; i<7; i++) {
        const x = new Date(sunday);
        x.setDate(sunday.getDate() + i);
        days.push(x);
      }
    }
    return `<div style="margin-top:14px" class="table-wrap"><table class="table"><thead><tr>${days.map(x=>`<th>${x.toLocaleDateString('vi-VN',{weekday:'short',day:'2-digit',month:'2-digit'})}</th>`).join('')}</tr></thead><tbody><tr>${days.map(x=>{const key=x.toISOString().slice(0,10);return `<td style="vertical-align:top;height:280px">${(byDay[key]||[]).sort((a,b)=>new Date(a.schedule)-new Date(b.schedule)).map(p=>`<div class="event ${p.status==='Failed'?'failed':p.status==='Published'?'published':''}" data-cal-post="${p.id}" draggable="true"><b>${p.schedule.slice(11,16)} · ${escape(p.title)}</b><span>${Object.keys(p.platforms||{})[0]}</span></div>`).join('')||'<div class="help">No schedule</div>'}</td>`}).join('')}</tr></tbody></table></div>`;

  // --- Core Logistics & Actions ---
  async function aiGenerate(input) {
    showLoading(); await new Promise(r => setTimeout(r, 650)); hideLoading();
    const topic = input.topic || state.draft?.title || 'nội dung social';
    const tone = input.tone || 'Professional';
    const audience = input.audience || 'người đi làm';
    const goal = input.goal || 'Tăng tương tác';
    const base = `Chủ đề: ${topic}. Đối tượng: ${audience}. Tone: ${tone}. Mục tiêu: ${goal}.`;
    
    return {
      Facebook: `${topic} không chỉ là một chủ đề — đó là cơ hội để bạn tạo giá trị thật cho cộng đồng. ${base} Hãy lưu bài viết và chia sẻ cho người đang cần.`,
      TikTok: `HOOK: ${topic} — bạn đang làm đúng chưa?\n3 điểm ngắn gọn để áp dụng ngay.\nCTA: Comment "DINO" để nhận thêm nội dung. #${slug(topic)} #xuhuong`,
      Instagram: `✨ ${topic}\n\nMột nội dung ngắn, một góc nhìn rõ ràng, và một bước nhỏ để cải thiện mỗi ngày. ${base}\n\n#${slug(topic)} #socialmedia #skills`,
      YouTube: { title: `${topic} | Hướng dẫn thực tế dễ áp dụng`, description: `${topic}\n\n${base}\nTrong video này, chúng ta đi qua các ý chính, ví dụ và cách áp dụng.`, tags: `${slug(topic)}, kỹ năng, social media, hướng dẫn` },
      X: `${topic}: một ý tưởng đáng thử hôm nay. ${base} Bạn đồng ý không?`
    };
  }
  
  function slug(s) { return String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-zA-Z0-9]+/g,'').toLowerCase().slice(0,24) }

  function persistAndRender() { save(); render(); }
  
  function render() {
    try {
      // 1. Maintain input focus state if typing
      let activeInputId = null;
      let selectionStart = 0;
      if (document.activeElement && document.activeElement.tagName === 'INPUT' && document.activeElement.id) {
        activeInputId = document.activeElement.id;
        selectionStart = document.activeElement.selectionStart;
      }

      const p = state.page || 'dashboard';
      document.querySelectorAll('.nav-item').forEach(b => b.classList.toggle('active', b.dataset.page === p));
      document.querySelectorAll('.mobile-bottom button').forEach(b => b.classList.toggle('active', b.dataset.page === p));
      document.getElementById('breadcrumbCurrent').textContent = pageNames[p] || p;
      document.getElementById('sidebar').classList.toggle('collapsed', !!state.sidebarCollapsed);
      
      let html = '';
      switch(p) {
        case'dashboard': html=renderDashboard(); break;
        case'create': html=renderCreate(); break;
        case'posts': html=renderPosts(); break;
        case'schedule': html=renderSchedule(); break;
        case'accounts': html=renderAccounts(); break;
        case'media': html=renderMedia(); break;
        case'bulk': html=renderBulk(); break;
        case'queue': html=renderQueue(); break;
        case'team': html=renderTeam(); break;
        case'analytics': html=renderAnalytics(); break;
        case'notifications': html=renderNotifications(); break;
        case'settings': html=renderSettings(); break;
        default: html=renderDashboard();
      }
      document.getElementById('content').innerHTML = html;
      updateNotifCount();
      lucide.createIcons();
      bindPage();

      // 2. Restore input focus
      if (activeInputId) {
        const el = document.getElementById(activeInputId);
        if (el) { el.focus(); el.setSelectionRange(selectionStart, selectionStart); }
      }
    } catch(e) {
      console.error(e);
      document.getElementById('content').innerHTML = `<div class="card card-pad"><div class="notice danger"><b>Không thể hiển thị module.</b><br>${escape(e.message)}</div><button class="btn primary" id="recoverRender">Retry</button></div>`;
      document.getElementById('recoverRender').onclick = () => render();
    }
  }

  function navigate(page) { state.page = page; save(); render(); window.scrollTo({top:0, behavior:'smooth'}); }
  
  function bindPage() {
    // Basic navigation & Modals
    document.querySelectorAll('[data-page]').forEach(el => el.onclick = () => navigate(el.dataset.page));
    document.querySelectorAll('[data-page-go]').forEach(el => el.onclick = () => navigate(el.dataset.pageGo));
    document.querySelectorAll('[data-close-modal]').forEach(el => el.onclick = closeModal);
    
    // Posts Actions
    document.querySelectorAll('[data-view-post]').forEach(el => el.onclick = () => viewPost(el.dataset.viewPost));
    document.querySelectorAll('[data-edit-post]').forEach(el => el.onclick = () => editPost(el.dataset.editPost));
    document.querySelectorAll('[data-delete-post]').forEach(el => el.onclick = () => deletePost(el.dataset.deletePost));
    document.querySelectorAll('[data-duplicate-post]').forEach(el => el.onclick = () => duplicatePost(el.dataset.duplicatePost));
    document.querySelectorAll('[data-cancel-post]').forEach(el => el.onclick = () => cancelPost(el.dataset.cancelPost));
    document.querySelectorAll('[data-retry-post]').forEach(el => el.onclick = () => retryPost(el.dataset.retryPost));
    
    // Filters & Tabs
    document.querySelectorAll('[data-post-filter]').forEach(el => el.onclick = () => { state.postFilter = el.dataset.postFilter; save(); render(); });
    document.querySelectorAll('[data-media-filter]').forEach(el => el.onclick = () => { state.mediaFilter = el.dataset.mediaFilter; save(); render(); });
    document.querySelectorAll('[data-settings-tab]').forEach(el => el.onclick = () => { state.settingsTab = el.dataset.settingsTab; save(); render(); });
    document.querySelectorAll('[data-cal-mode]').forEach(el => el.onclick = () => { state.calendarMode = el.dataset.calMode; save(); render(); });
    
    // Create Post Logic
    document.querySelectorAll('[data-platform-check]').forEach(el => el.onchange = () => {
      const p = el.dataset.platformCheck;
      if(el.checked) {
        if(!state.draft.selectedPlatforms.includes(p)) state.draft.selectedPlatforms.push(p);
        state.draft.platforms[p] = state.draft.platforms[p] || defaultDraft().platforms[p];
        state.draft.activeTab = p;
      } else {
        state.draft.selectedPlatforms = state.draft.selectedPlatforms.filter(x => x !== p);
        if(state.draft.activeTab === p) state.draft.activeTab = state.draft.selectedPlatforms[0] || 'Facebook';
      }
      save(); render();
    });
    
    document.querySelectorAll('[data-platform-tab]').forEach(el => el.onclick = () => { readDraftFromUI(); state.draft.activeTab = el.dataset.platformTab; save(); render(); });
    document.querySelectorAll('[data-remove-draft-media]').forEach(el => el.onclick = () => { state.draft.mediaIds = state.draft.mediaIds.filter(x => x !== el.dataset.removeDraftMedia); save(); render(); });
    
    // Media Library Actions
    document.querySelectorAll('[data-preview-media]').forEach(el => el.onclick = () => previewMedia(el.dataset.previewMedia));
    document.querySelectorAll('[data-download-media]').forEach(el => el.onclick = () => downloadMedia(el.dataset.downloadMedia));
    document.querySelectorAll('[data-copy-media-url]').forEach(el => el.onclick = () => copyMediaUrl(el.dataset.copyMediaUrl));
    document.querySelectorAll('[data-rename-media]').forEach(el => el.onclick = () => renameMedia(el.dataset.renameMedia));
    document.querySelectorAll('[data-delete-media]').forEach(el => el.onclick = () => deleteMedia(el.dataset.deleteMedia));
    
    // Bulk Actions
    document.querySelectorAll('[data-bulk-remove]').forEach(el => el.onclick = () => { state.bulk = state.bulk.filter(x => x.id !== el.dataset.bulkRemove); save(); render(); });
    document.querySelectorAll('[data-bulk-retry]').forEach(el => el.onclick = () => bulkRetry(el.dataset.bulkRetry));
    document.querySelectorAll('[data-bulk-preview]').forEach(el => el.onclick = () => previewBulk(el.dataset.bulkPreview));
    
    // Queue / Accounts / Team
    document.querySelectorAll('[data-retry-job]').forEach(el => el.onclick = () => retryJob(el.dataset.retryJob));
    document.querySelectorAll('[data-reconnect-account]').forEach(el => el.onclick = () => reconnectAccount(el.dataset.reconnectAccount));
    document.querySelectorAll('[data-refresh-account]').forEach(el => el.onclick = () => refreshAccount(el.dataset.refreshAccount));

  function saveDraft() {
    readDraftFromUI();
    if(!state.draft.title.trim()) { toast('Vui lòng nhập Title', 'error'); return; }
    const existing = editingPostId ? state.posts.find(p => p.id === editingPostId) : null;
    if(existing) {
      existing.title = state.draft.title;
      existing.platforms = deepClone(Object.fromEntries(state.draft.selectedPlatforms.map(p => [p, state.draft.platforms[p]])));
      existing.mediaIds = [...state.draft.mediaIds];
      existing.status = 'Draft';
      audit('Updated Post', `Post #${existing.id}`);
      toast('Đã cập nhật bài viết', 'success');
    } else {
      const p = createPostFromDraft('Draft');
      state.posts.unshift(p);
      audit('Created Draft', `Post #${p.id}`);
      toast('Đã lưu bài viết', 'success');
    }
    save(); render();
  }

  function createPostFromDraft(status) {
    const d = deepClone(state.draft);
    let schedule = '';
    if(d.scheduleMode === 'schedule') schedule = `${d.scheduleDate}T${d.scheduleTime}:00+07:00`;
    return {
      id: uid('p'), title: d.title || 'Untitled Post', createdBy: state.profile.name,
      createdAt: nowISO(), status, schedule,
      platforms: Object.fromEntries(d.selectedPlatforms.map(p => [p, d.platforms[p]])),
      mediaIds: [...d.mediaIds]
    };
  }

  function savePostFromDraft() {
    readDraftFromUI();
    if(!state.draft.title.trim()) { toast('Vui lòng nhập Title', 'error'); return; }
    if(!state.draft.selectedPlatforms.length) { toast('Chọn ít nhất một nền tảng', 'error'); return; }
    
    const status = state.draft.scheduleMode === 'schedule' ? 'Scheduled' : 'Published';
    if(state.draft.scheduleMode === 'schedule' && !state.draft.scheduleDate) { toast('Chọn ngày lên lịch', 'error'); return; }
    
    let p = editingPostId ? state.posts.find(x => x.id === editingPostId) : null;
    if(p) {
      p.title = state.draft.title;
      p.platforms = Object.fromEntries(state.draft.selectedPlatforms.map(x => [x, state.draft.platforms[x]]));
      p.mediaIds = [...state.draft.mediaIds];
      p.status = status;
      p.schedule = state.draft.scheduleMode === 'schedule' ? `${state.draft.scheduleDate}T${state.draft.scheduleTime}:00+07:00` : nowISO();
    } else {
      p = createPostFromDraft(status);
      state.posts.unshift(p);
    }
    
    if(status === 'Published') { addNotification('Success', 'Demo publish complete', `${p.title} đã chuyển Published trong Demo Mode.`); } 
    else { addNotification('Info', 'Post scheduled', `${p.title} đã được lên lịch.`); }
    
    audit(status === 'Published' ? 'Published Demo Post' : 'Scheduled Post', `Post #${p.id}`);
    if(status === 'Published') queueForPost(p, 'Demo');
    
    save();
    toast(status === 'Published' ? 'Đã publish trong Demo Mode' : 'Đã lên lịch', 'success');
    state.draft = defaultDraft();
    editingPostId = null;
    navigate('posts');
  }

  function queueForPost(p, platformOverride) {
    const ps = platformOverride === 'Demo' ? Object.keys(p.platforms) : Object.keys(p.platforms || {});
    ps.forEach(platform => {
      const acc = state.accounts.find(a => a.platform === platform);
      state.queue.unshift({
        id: uid('j'), postId: p.id, platform, accountId: acc?.id || '',
        status: acc?.status === 'Connected' ? 'Waiting' : 'Authentication Required',
        attempts: 0, created: nowISO(), nextRetry: '—',
        error: acc?.status === 'Connected' ? '' : 'Account not connected'
      });
    });
  }

  function handleFiles(fileList, target) {
    const files = [...fileList];
    if(!files.length) return;
    const existingCount = target === 'bulk' ? state.bulk.length : state.media.length;
    if(target === 'bulk' && existingCount + files.length > 100) { toast(`Bulk Upload tối đa 100 files. Bạn đang có ${existingCount}.`, 'error'); return; }
    
    const allowed = ['image/jpeg', 'image/png', 'image/webp', 'video/mp4', 'video/quicktime'];
    const valid = files.filter(f => allowed.includes(f.type));
    if(valid.length < files.length) toast('Một số file bị bỏ qua do MIME không hợp lệ', 'warning');
    valid.forEach(f => processFile(f, target));
  }

  function processFile(file, target) {
    if(file.size > 25*1024*1024) { toast(`${file.name} vượt 25MB Demo limit`, 'error'); return; }
    const type = file.type.startsWith('video/') ? 'video' : 'image';
    const id = uid(target === 'bulk' ? 'b' : 'm');
    const rec = { id, name: file.name, size: file.size, type, duration: type === 'video' ? 'Demo / detect in browser' : '—', status: target === 'bulk' ? 'Uploading' : 'Ready', progress: 0, createdAt: nowISO(), usedCount: 0, preview: '' };
    
    if(type === 'image') {
      const reader = new FileReader();
      reader.onload = () => { rec.preview = reader.result; finishFile(rec, target); };
      reader.readAsDataURL(file);
    } else {
      const url = URL.createObjectURL(file);
      rec.preview = url;
      finishFile(rec, target);
    }
  }

  function finishFile(rec, target) {
    if(target === 'bulk') {
      state.bulk.push(rec); save(); render();
      let p = 0;
      const timer = setInterval(() => {
        p += 20;
        const x = state.bulk.find(b => b.id === rec.id);
        if(!x) { clearInterval(timer); return; }
        x.progress = p;
        x.status = p < 40 ? 'Uploading' : p < 80 ? 'Processing' : 'Ready';
        save();
        if(p >= 100) {
          clearInterval(timer);
          x.status = 'Ready'; x.progress = 100;
          addNotification('Success', 'Bulk upload ready', x.name);
        }
        render();
      }, 90);
    } else {
      state.media.unshift(rec);
      save(); audit('Uploaded Media', rec.name);
      toast(`Đã upload ${rec.name}`, 'success'); render();
    }
  }

    openModal(`
      <div class="modal-header"><div class="modal-title">Rename media</div><button class="close" data-close-modal><i data-lucide="x"></i></button></div>
      <div class="modal-body"><label class="field"><span class="label">Filename</span><input class="input" id="renameInput" value="${escape(m.name)}"></label></div>
      <div class="modal-footer"><button class="btn" data-close-modal>Hủy</button><button class="btn primary" id="renameSave">Save</button></div>
    `);
    document.getElementById('renameSave').onclick = () => { m.name = document.getElementById('renameInput').value.trim() || m.name; audit('Renamed Media', m.name); save(); closeModal(); toast('Đã đổi tên media'); render(); };
  }

  function deleteMedia(id) {
    const m = state.media.find(x => x.id === id); if(!m) return;
    confirmModal('Xoá media', `Xoá file "${m.name}"?`, () => {
      state.media = state.media.filter(x => x.id !== id);
      state.posts.forEach(p => p.mediaIds = (p.mediaIds || []).filter(x => x !== id));
      audit('Deleted Media', m.name); save(); toast('Đã xoá media'); render();
    });
  }

  function bulkRetry(id) {
    const b = state.bulk.find(x => x.id === id); if(!b) return;
    b.status = 'Uploading'; b.progress = 0; save(); render();
    setTimeout(() => { b.status = 'Ready'; b.progress = 100; save(); toast(`Retry thành công: ${b.name}`); render(); }, 500);
  }

  function generateBulkCaptions() {
    const ready = state.bulk.filter(x => x.status === 'Ready');
    const lines = ready.slice(0,100).map((b,i) => ({name: b.name, caption: `${b.name.replace(/\.[^.]+$/,'')}: Hook ${i+1} — nội dung ngắn gọn, CTA rõ ràng. #DinoSocialHub #content`}));
    document.getElementById('bulkCaptionPreview').innerHTML = `<div class="notice info"><b>Generated ${lines.length} captions.</b> Preview trước khi Create Posts.</div><div class="table-wrap" style="margin-top:8px"><table class="table"><thead><tr><th>File</th><th>Caption</th></tr></thead><tbody>${lines.slice(0,10).map(x=>`<tr><td>${escape(x.name)}</td><td>${escape(x.caption)}</td></tr>`).join('')}</tbody></table>${lines.length>10?`<div class="help" style="padding:8px">+ ${lines.length-10} captions khác...</div>`:''}</div>`;
    state.bulk.forEach(b => { const matched = lines.find(x => x.name === b.name); if(matched) b.caption = matched.caption; });
    save(); toast(`Đã generate ${lines.length} captions riêng cho từng file`);
  }

  function applyBulkAll() {
    const platform = document.getElementById('bulkPlatform').value;
    const account = document.getElementById('bulkAccount').value;
    const schedule = document.getElementById('bulkSchedule').value;
    state.bulk.filter(x => x.status === 'Ready').forEach(b => { b.platform = platform; b.accountId = account; b.schedule = schedule; });
    save(); toast('Đã Apply to all', 'success'); render();
  }

  function createBulkPosts() {
    const list = state.bulk.filter(x => x.status === 'Ready');
    if(!list.length) { toast('Không có file Ready', 'error'); return; }
    const platform = document.getElementById('bulkPlatform').value;
    
    list.forEach(b => {
      const p = {
        id: uid('p'), title: b.name.replace(/\.[^.]+$/,''), createdBy: state.profile.name,
        createdAt: nowISO(), status: 'Scheduled', schedule: b.schedule || '',
        platforms: { [platform]: platform==='YouTube'?{title:b.name.replace(/\.[^.]+$/,''),description:b.caption||'Bulk generated content',tags:'dino,social,content'}:platform==='X'?{text:b.caption||b.name}:{caption:b.caption||`Nội dung cho ${b.name}`,hashtag:'#DinoSocialHub'} },
        mediaIds: [b.id]
      };
      state.posts.unshift(p);
      b.status = 'Uploaded';
      audit('Created Bulk Post', `Post #${p.id}`);
    });
    save(); addNotification('Success', 'Bulk posts created', `Đã tạo ${list.length} posts.`); toast(`Đã tạo ${list.length} bài viết`); render();
  }

  function processQueue() {
    showLoading();
    setTimeout(() => {
      state.queue.forEach(j => {
        if(j.status !== 'Waiting') return;
        j.status = 'Processing'; j.attempts++;
        setTimeout(() => {
          const acc = state.accounts.find(a => a.id === j.accountId);
          if(acc?.status === 'Connected') {
            j.status = 'Success'; j.nextRetry = '—';
            const p = state.posts.find(x => x.id === j.postId); if(p) p.status = 'Published';
            addNotification('Success', 'Post published', `Demo job ${j.id} đã thành công.`);
          } else {
            j.status = 'Authentication Required'; j.error = 'Access Token Expired'; j.nextRetry = '—';
            addNotification('Error', 'Token Expired', `${j.platform} cần reconnect.`);
          }
          save(); render();
        }, 600);
      });
      save(); hideLoading(); toast('Queue đang được process trong Demo Mode', 'info'); render();
    }, 450);
  }

  function retryJob(id) {
    const j = state.queue.find(x => x.id === id); if(!j) return;
    if(j.attempts >= 5) { j.status = 'Failed'; toast('Đã đạt giới hạn retry 5 lần', 'error'); return; }
    
    j.status = 'Retrying'; j.attempts++;
    j.nextRetry = ['1 phút','5 phút','15 phút','1 giờ','6 giờ'][j.attempts-1] || '—';
    state.retryLogs.unshift({id:uid('r'), jobId:id, attempt:j.attempts, time:nowISO(), status:'Retrying', error:j.error||'Manual retry'});
    save(); toast(`Đã đưa ${id} vào retry attempt ${j.attempts}`, 'info');
    
    setTimeout(() => {
      const acc = state.accounts.find(a => a.id === j.accountId);
      if(acc?.status === 'Connected') {
        j.status = 'Success'; j.nextRetry = '—';
        const p = state.posts.find(x => x.id === j.postId); if(p) p.status = 'Published';
        addNotification('Success', 'Retry succeeded', `Job ${j.id} thành công.`);
      } else {
        j.status = 'Authentication Required'; j.error = 'Access Token Expired';
        addNotification('Error', 'Retry blocked', `Job ${j.id}: cần Reconnect Account.`);
      }
      save(); render();
    }, 700);
    render();
  }

  function reconnectAccount(id) {
    const a = state.accounts.find(x => x.id === id); if(!a) return;
    a.status = 'Connected'; a.token = 'Healthy'; a.lastSync = nowISO();
    state.queue.filter(j => j.accountId === id && j.status === 'Authentication Required').forEach(j => { j.status = 'Retrying'; j.nextRetry = 'Now'; });
    audit('Reconnected Account', `${a.platform} ${a.username}`); save();
    addNotification('Success', 'Account reconnected', `${a.platform} ${a.username} đã Connected.`);
    toast('Đã reconnect tài khoản'); render();
  }

  function refreshAccount(id) {
    const a = state.accounts.find(x => x.id === id); if(!a) return;
    a.lastSync = nowISO(); if(a.status === 'Connected') a.token = 'Healthy';
    save(); toast(`Đã refresh ${a.username}`); render();
  }

  function disconnectAccount(id) {
    const a = state.accounts.find(x => x.id === id); if(!a) return;
    confirmModal('Disconnect account', `Ngắt kết nối ${a.username}?`, () => {
      a.status = 'Disconnected'; a.token = 'Unavailable';
      audit('Disconnected Account', `${a.platform} ${a.username}`); save();
      addNotification('Warning', 'Account Disconnected', a.username);
      toast('Đã disconnect'); render();
    });
  }

  function deleteAccount(id) {
    const a = state.accounts.find(x => x.id === id); if(!a) return;
    confirmModal('Xoá tài khoản', `Xoá ${a.platform} · ${a.username}?`, () => {
      state.accounts = state.accounts.filter(x => x.id !== id);
      state.queue = state.queue.filter(j => j.accountId !== id);
      audit('Deleted Account', `${a.platform} ${a.username}`); save();
      toast('Đã xoá tài khoản'); render();
    });
  }

  function openConnectModal() {
    openModal(`
      <div class="modal-header"><div class="modal-title">Connect Social Account</div><button class="close" data-close-modal><i data-lucide="x"></i></button></div>
      <div class="modal-body"><div class="notice info">OAuth Demo Architecture: chọn nền tảng sẽ tạo account demo Connected. Production phải chuyển qua <code>POST /api/accounts/connect</code> → OAuth callback.</div>
      <div class="platform-selector" style="margin-top:12px">${platforms.map(p=>`<button class="platform-card" data-connect-platform="${p}"><div class="p-head">${platformBadge(p)}<i data-lucide="plug-zap"></i></div><small>Connect via OAuth</small></button>`).join('')}</div></div>
      <div class="modal-footer"><button class="btn" data-close-modal>Đóng</button></div>
    `);
    document.querySelectorAll('[data-connect-platform]').forEach(el => el.onclick = () => {
      const p = el.dataset.connectPlatform;
      const a = {id:uid('a'), platform:p, name:`${p} Demo Account`, username:`@demo_${p.toLowerCase()}`, status:'Connected', token:'Healthy', lastSync:nowISO()};
      state.accounts.unshift(a);
      audit('Connected Account', `${p} ${a.username}`); save(); closeModal();
      addNotification('Success', 'Account connected', `${p} demo account connected.`);
      toast('Đã kết nối tài khoản Demo', 'success'); render();
    });
  }

  function openOAuthModal() {
    openModal(`
      <div class="modal-header"><div class="modal-title">OAuth Architecture</div><button class="close" data-close-modal><i data-lucide="x"></i></button></div>
      <div class="modal-body"><div class="timeline">${['facebookService','tiktokService','youtubeService','instagramService','xService'].map(s=>`<div class="timeline-item"><div class="timeline-dot"></div><div><b>${s}</b><span>connect() · callback() · refreshToken() · disconnect() · publishPost() · getAccount() · getStatus()</span></div></div>`).join('')}</div><div class="notice warn" style="margin-top:13px"><b>Frontend routes:</b> POST /api/accounts/connect · GET /api/accounts/callback · POST /api/posts/publish. Demo HTML không gọi các endpoint này.</div></div>
      <div class="modal-footer"><button class="btn primary" data-close-modal>OK</button></div>
    `);
  }

  function openUserModal(id) {
    const u = id ? state.users.find(x => x.id === id) : null;
    openModal(`
      <div class="modal-header"><div class="modal-title">${u ? 'Edit member' : 'Add member'}</div><button class="close" data-close-modal><i data-lucide="x"></i></button></div>
      <div class="modal-body"><div class="form-grid">
        <label class="field"><span class="label">Name</span><input class="input" id="uName" value="${escape(u?.name||'')}"></label>
        <label class="field"><span class="label">Email</span><input class="input" id="uEmail" value="${escape(u?.email||'')}"></label>
        <label class="field"><span class="label">Role</span><select class="select" id="uRole">${['ADMIN','MANAGER','EDITOR','VIEWER'].map(r=>`<option ${u?.role===r?'selected':''}>${r}</option>`).join('')}</select></label>
        <label class="field"><span class="label">Status</span><select class="select" id="uStatus"><option ${u?.status==='Active'||!u?'selected':''}>Active</option><option ${u?.status==='Disabled'?'selected':''}>Disabled</option></select></label>
      </div></div>
      <div class="modal-footer"><button class="btn" data-close-modal>Hủy</button><button class="btn primary" id="saveUser">Save</button></div>
    `);
    document.getElementById('saveUser').onclick = () => {
      const name = document.getElementById('uName').value.trim();
      const email = document.getElementById('uEmail').value.trim();
      if(!name || !email) { toast('Name và Email là bắt buộc', 'error'); return; }
      
      if(u) {
        u.name = name; u.email = email; u.role = document.getElementById('uRole').value; u.status = document.getElementById('uStatus').value; u.lastActive = nowISO();
        audit('Updated Team Member', email);
      } else {
        state.users.push({id:uid('u'), name, email, role:document.getElementById('uRole').value, status:document.getElementById('uStatus').value, lastActive:nowISO()});
        audit('Added Team Member', email);
      }
      save(); closeModal(); toast(u ? 'Đã cập nhật thành viên' : 'Đã thêm thành viên'); render();
    };
  }

  function editUser(id) { openUserModal(id); }
  
  function toggleUser(id) {
    const u = state.users.find(x => x.id === id); if(!u) return;
    if(u.role === 'ADMIN' && u.status === 'Active') { toast('Không thể disable ADMIN đang đăng nhập trong Demo Mode', 'warning'); return; }
    u.status = u.status === 'Active' ? 'Disabled' : 'Active'; u.lastActive = nowISO();
    audit(u.status === 'Active' ? 'Enabled User' : 'Disabled User', u.email);
    save(); toast(`${u.status === 'Active' ? 'Đã enable' : 'Đã disable'} ${u.name}`); render();
  }

  function resetUser(id) {
    const u = state.users.find(x => x.id === id); if(!u) return;
    toast(`Reset Password đã được ghi nhận cho ${u.email}`, 'info');
    audit('Reset Password', u.email); save();
  }

  function deleteUser(id) {
    const u = state.users.find(x => x.id === id); if(!u) return;
    confirmModal('Xoá team member', `Xoá ${u.name}?`, () => {
      state.users = state.users.filter(x => x.id !== id);
      audit('Deleted Team Member', u.email); save(); toast('Đã xoá thành viên'); render();
    });
  }

  function openRBAC() {
    openModal(`
      <div class="modal-header"><div class="modal-title">RBAC / Permissions</div><button class="close" data-close-modal><i data-lucide="x"></i></button></div>
      <div class="modal-body"><table class="table"><thead><tr><th>Role</th><th>Access</th></tr></thead><tbody>${Object.entries(rolePermissions).map(([r,p])=>`<tr><td><b>${r}</b></td><td>${p.includes('*')?'Full access':p.join(' · ')}</td></tr>`).join('')}</tbody></table><div class="notice info" style="margin-top:12px">Backend implementation target: <code>requireRole()</code> và <code>requirePermission()</code>.</div></div>
      <div class="modal-footer"><button class="btn primary" data-close-modal>OK</button></div>
    `);
  }

  function shiftCal(dir) {
    const d = new Date(calendarSelectedDate+'T12:00:00');
    d.setMonth(d.getMonth() + dir);
    calendarSelectedDate = d.toISOString().slice(0,10);
    state.calendarDate = calendarSelectedDate;
    save(); render();
  }

  function toggleNotif(id) { const n = state.notifications.find(x => x.id === id); if(n) n.read = !n.read; save(); render(); }
  function deleteNotif(id) { state.notifications = state.notifications.filter(x => x.id !== id); save(); render(); }
  
  function applyAI(p) {
    const out = window.__aiResults?.[p];
    if(!out || !state.draft) return;
    state.draft.platforms[p] = state.draft.platforms[p] || {};
    if(p === 'YouTube') {
      state.draft.platforms.YouTube.title = out.title;
      state.draft.platforms.YouTube.description = out.description;
      state.draft.platforms.YouTube.tags = out.tags;
    } else if(p === 'X') {
      state.draft.platforms.X.text = out;
    } else {
      state.draft.platforms[p].caption = out;
    }
    state.draft.activeTab = p; save(); toast(`Đã Apply AI cho ${p}`); closeModal();
    if(state.page !== 'create') { state.page = 'create'; }
    render();
  }

  function editAIBox(p) {
    const box = document.getElementById('ai_' + p);
    if(!box) return;
    box.contentEditable = true; box.focus(); box.style.background = '#fff'; box.style.border = '1px solid #93c5fd';
    toast('Có thể chỉnh trực tiếp nội dung AI', 'info');
  }

  // --- Import / Export Workspace ---
  function exportWorkspace() {
    const blob = new Blob([JSON.stringify(state, null, 2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url;
    a.download = `dino_social_hub_workspace_${new Date().toISOString().slice(0,10)}.json`;
    a.click(); URL.revokeObjectURL(url); toast('Đã export workspace JSON', 'success');
  }

  function importWorkspace(file) {
    const r = new FileReader();
    r.onload = () => {
      try {
        const incoming = JSON.parse(r.result);
        if(!incoming.version || !Array.isArray(incoming.posts) || !Array.isArray(incoming.accounts)) { throw new Error('JSON không đúng format DINO Social Hub'); }
        state = {...deepClone(seedState), ...incoming}; save(); toast('Import workspace thành công', 'success'); render();
      } catch(e) { toast(e.message, 'error'); }
    };
    r.readAsText(file);
  }

  // Global Event Delegation (Click Outside / App-wide actions)
  window.addEventListener('click', e => {
    const el = e.target.closest('[data-action]');
    if(el) {
      const a = el.dataset.action;
      if(a === 'export') exportWorkspace();
      if(a === 'profile') { state.settingsTab = 'Profile'; navigate('settings'); }
      if(a === 'settings') navigate('settings');
      if(a === 'import') window.importWorkspace();
    }
    
    const copy = e.target.closest('[data-copy-ai]');
    if(copy) {
      const p = copy.dataset.copyAi;
      const txt = p === 'YouTube' ? `Title: ${window.__aiResults[p].title}\n${window.__aiResults[p].description}\nTags: ${window.__aiResults[p].tags}` : window.__aiResults[p];
      navigator.clipboard?.writeText(txt); toast('Đã copy caption');
    }
    
    const applyAiBtn = e.target.closest('[data-apply-ai]');
    if(applyAiBtn) applyAI(applyAiBtn.dataset.applyAi);
    
    const editAiBtn = e.target.closest('[data-edit-ai]');
    if(editAiBtn) editAIBox(editAiBtn.dataset.editAi);
  });

  document.getElementById('collapseBtn').onclick = () => { state.sidebarCollapsed = !state.sidebarCollapsed; save(); render(); };
  document.getElementById('userMenuBtn').onclick = () => document.getElementById('userMenu').classList.toggle('show');
  
  document.addEventListener('click', e => {
    if(!e.target.closest('#userMenuBtn') && !e.target.closest('#userMenu')) document.getElementById('userMenu').classList.remove('show');
  });
  
  document.getElementById('modalBackdrop').addEventListener('click', e => { if(e.target.id === 'modalBackdrop') closeModal(); });
  
  window.addEventListener('keydown', e => {
    if(e.key === 'Escape') closeModal();
    if((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); document.getElementById('globalSearch').focus(); }
  });
  
  window.addEventListener('beforeunload', save);
  
  // Single Global Event for `#hiddenFile`
  document.getElementById('hiddenFile').onchange = e => {
    handleFiles(e.target.files, state.page === 'bulk' ? 'bulk' : 'create');
    e.target.value = '';
  };

  // Demo export/import helper via hidden file prompt
  window.importWorkspace = () => {
    const input = document.createElement('input'); input.type = 'file'; input.accept = 'application/json';
    input.onchange = () => input.files[0] && importWorkspace(input.files[0]); input.click();
  };

  // Initialize
  state.page = state.page || 'dashboard'; save(); render();
})();
</script>
</body>
</html>
