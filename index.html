<script>
const WEBHOOK_LIST = "https://hook.make.com/WEBHOOK-LAY-DANH-SACH";
const WEBHOOK_POST = "https://hook.make.com/WEBHOOK-DANG-BAI";

async function loadPages() {
const select = document.getElementById('page');
select.innerHTML = '<option value="">— Đang tải... —</option>';
try {
const res = await fetch(WEBHOOK_LIST);
const pages = await res.json();
select.innerHTML = '<option value="">— Chọn fanpage —</option>';
if (Array.isArray(pages) && pages.length === 0) {
select.innerHTML = '<option value="">Không có fanpage nào</option>';
}
pages.forEach(p => {
const opt = document.createElement('option');
opt.value = p.id || p.page_id;
opt.textContent = p.name || p.page_name;
select.appendChild(opt);
});
} catch (e) {
console.error('Lỗi tải danh sách:', e);
select.innerHTML = '<option value="">Lỗi tải danh sách</option>';
}
}

async function postToFb() {
const page = document.getElementById('page').value;
const content = document.getElementById('content').value.trim();
const image = document.getElementById('image').value.trim();
const schedule = document.getElementById('schedule').value;
const status = document.getElementById('status');
const btn = document.getElementById('submitBtn');

if (!page) { showStatus('Chưa chọn fanpage!', 'error'); return; }
if (!content) { showStatus('Nội dung chưa có!', 'error'); return; }

btn.disabled = true;
showStatus(schedule ? 'Đang lên lịch đăng...' : 'Đang đăng bài...', 'loading', true);

const payload = {
page_id: page,
content: content,
image: image || null,
schedule: schedule || null,
timestamp: new Date().toISOString()
};

try {
const res = await fetch(WEBHOOK_POST, {
method: 'POST',
headers: { 'Content-Type': 'application/json' },
body: JSON.stringify(payload)
});
const result = await res.json().catch(() => ({}));
if (result.error) {
showStatus('Thất bại: ' + result.error, 'error');
} else {
showStatus(schedule ? 'Đã lên lịch! Sẽ đăng vào giờ bạn chọn.' : 'Đã gửi! Make.com đang xử lý đăng bài.', 'success');
document.getElementById('content').value = '';
document.getElementById('image').value = '';
document.getElementById('schedule').value = '';
}
} catch (e) {
showStatus('Lỗi kết nối: ' + e.message, 'error');
} finally {
btn.disabled = false;
}
}

function showStatus(msg, type, loading) {
const el = document.getElementById('status');
el.className = 'status ' + type;
el.innerHTML = (loading ? '
' : '') + msg;
}

window.onload = loadPages;
</script>
