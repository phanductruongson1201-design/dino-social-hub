<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dino Social Hub - Quản lý Social Media</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    :root{
      --primary:#1677ff;--primary-dark:#0d5bd7;--primary-light:#eaf3ff;
      --bg:#f5f8fc;--card:#fff;--text:#13203a;--muted:#6d7890;
      --border:#e5ebf3;--success:#16a36a;--warning:#f59e0b;--danger:#ef4444;
      --shadow:0 8px 30px rgba(24,55,100,.07);--radius:16px
    }
    body{font-family:Inter,Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
    button,input,textarea,select{font:inherit}
    button{cursor:pointer;border:0}
    .app{display:flex;min-height:100vh}
    .sidebar{width:250px;background:#fff;border-right:1px solid var(--border);padding:22px 15px;position:fixed;left:0;top:0;bottom:0;z-index:20}
    .brand{display:flex;align-items:center;gap:11px;padding:4px 10px 28px}
    .brand-logo{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,#1683ff,#0754d8);display:grid;place-items:center;color:#fff;font-size:20px;box-shadow:0 8px 20px rgba(22,119,255,.25)}
    .brand strong{display:block;font-size:15px;letter-spacing:.3px}
    .brand span{display:block;color:var(--muted);font-size:11px;margin-top:3px}
    .nav-title{font-size:10px;color:#9aa5b8;text-transform:uppercase;font-weight:700;padding:10px 12px}
    .nav{display:flex;flex-direction:column;gap:5px}
    .nav button{background:transparent;color:#657188;padding:11px 12px;border-radius:11px;text-align:left;display:flex;align-items:center;gap:12px;font-size:13px}
    .nav button:hover{background:#f5f8fd;color:var(--primary)}
    .nav button.active{background:var(--primary-light);color:var(--primary);font-weight:700}
    .nav .icon{width:19px;text-align:center;font-size:16px}
    .sidebar-bottom{position:absolute;bottom:18px;left:15px;right:15px;border-top:1px solid var(--border);padding-top:16px}
    .user-mini{display:flex;align-items:center;gap:10px;padding:9px}
    .avatar{width:35px;height:35px;border-radius:50%;background:linear-gradient(135deg,#b9ddff,#1677ff);display:grid;place-items:center;color:#fff;font-weight:700;font-size:13px}
    .user-mini strong{font-size:12px}.user-mini span{display:block;color:var(--muted);font-size:10px;margin-top:2px}
    .main{margin-left:250px;width:calc(100% - 250px)}
    .topbar{height:72px;background:#fff;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 30px;position:sticky;top:0;z-index:10}
    .breadcrumb{font-size:13px;color:var(--muted)}.breadcrumb strong{color:var(--text)}
    .top-actions{display:flex;align-items:center;gap:10px}
    .search{width:220px;background:#f7f9fc;border:1px solid var(--border);padding:10px 13px;border-radius:10px;outline:none;font-size:12px}
    .icon-btn{width:38px;height:38px;border:1px solid var(--border);background:#fff;border-radius:10px;position:relative}
    .dot{position:absolute;width:7px;height:7px;border-radius:50%;background:#ef4444;right:7px;top:6px}
    .primary{background:var(--primary);color:#fff;padding:11px 16px;border-radius:10px;font-weight:700;font-size:12px;box-shadow:0 6px 15px rgba(22,119,255,.18)}
    .primary:hover{background:var(--primary-dark)}
    .content{padding:28px 30px 40px}
    .page-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}
    .page-head h1{font-size:25px;letter-spacing:-.5px}.page-head p{color:var(--muted);font-size:12px;margin-top:6px}
    .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:22px}
    .card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
    .stat{padding:19px;display:flex;justify-content:space-between;align-items:flex-start}
    .stat small{color:var(--muted);font-size:11px}.stat h2{font-size:25px;margin:9px 0 5px}.trend{font-size:10px;color:var(--success);font-weight:700}
    .stat-icon{width:42px;height:42px;border-radius:12px;background:var(--primary-light);display:grid;place-items:center;color:var(--primary);font-size:18px}
    .dashboard-grid{display:grid;grid-template-columns:1.7fr 1fr;gap:18px}
    .section{padding:20px}
    .section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
    .section-head h3{font-size:15px}.section-head span{font-size:11px;color:var(--muted)}
    .quick{padding:22px;background:linear-gradient(135deg,#fafdff,#eef6ff);border:1px solid #dbeaff}
    .quick h3{font-size:18px}.quick p{color:var(--muted);font-size:12px;margin:7px 0 16px}
    .quick-actions{display:flex;gap:9px}.secondary{background:#fff;border:1px solid var(--border);padding:10px 13px;border-radius:9px;font-size:11px;color:#44516a}
    .secondary:hover{border-color:#b8d3ff;color:var(--primary)}
    .post-row{display:grid;grid-template-columns:46px 1fr 150px 100px 70px;gap:12px;align-items:center;padding:13px 0;border-top:1px solid #eef1f6}
    .thumb{width:46px;height:40px;border-radius:9px;background:linear-gradient(135deg,#dbeafe,#bfdbfe);display:grid;place-items:center;font-size:17px}
    .post-title{font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.post-meta{font-size:10px;color:var(--muted);margin-top:4px}
    .platforms{display:flex;gap:5px}.platform{width:25px;height:25px;border-radius:7px;background:#f3f6fa;display:grid;place-items:center;font-size:12px}
    .badge{display:inline-flex;padding:5px 8px;border-radius:20px;font-size:9px;font-weight:700}
    .badge.success{color:#078354;background:#e8f8f1}.badge.schedule{color:#1769d2;background:#e9f2ff}.badge.warn{color:#b66b00;background:#fff5dd}.badge.danger{color:#c42d2d;background:#ffeded}.badge.gray{color:#68758b;background:#f0f3f7}
    .schedule-item{display:flex;gap:12px;padding:13px 0;border-top:1px solid #eef1f6}
    .date-box{width:45px;height:48px;border-radius:10px;background:var(--primary-light);text-align:center;padding-top:7px;color:var(--primary);flex:none}.date-box strong{display:block;font-size:17px}.date-box span{font-size:8px;text-transform:uppercase}
    .schedule-item strong{font-size:12px}.schedule-item p{font-size:10px;color:var(--muted);margin-top:4px}.schedule-time{margin-left:auto;font-size:10px;font-weight:700}
    /* Composer */
    .composer{display:none}
    .composer.active{display:block}
    .dashboard.hidden{display:none}
    .composer-layout{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(290px,.7fr);gap:18px}
    .editor-card{padding:22px}.editor-title{font-size:18px;font-weight:800;margin-bottom:17px}
    .editor-tools{display:flex;gap:6px;border-bottom:1px solid var(--border);padding-bottom:11px;margin-bottom:13px}
    .tool{background:#f5f7fa;border:1px solid #e9edf3;border-radius:8px;padding:7px 9px;font-size:11px}
    textarea{width:100%;min-height:145px;resize:vertical;border:0;outline:0;font-size:14px;line-height:1.65;color:var(--text)}
    .counter{text-align:right;color:#9aa5b8;font-size:10px}
    .upload{border:1.5px dashed #cbd8e8;border-radius:13px;padding:22px;text-align:center;background:#fafcff;margin-top:15px}
    .upload .upload-icon{font-size:25px;color:var(--primary);margin-bottom:7px}.upload strong{font-size:12px}.upload p{font-size:10px;color:var(--muted);margin-top:5px}
    #fileInput{display:none}
    .media-preview{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.media-item{position:relative}.media-item img{width:76px;height:62px;object-fit:cover;border-radius:8px}.remove-media{position:absolute;right:-5px;top:-5px;width:18px;height:18px;border-radius:50%;background:#ef4444;color:#fff;font-size:11px}
    .platform-section{margin-top:20px}.label{font-size:11px;font-weight:800;margin-bottom:10px}
    .platform-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
    .platform-select{padding:11px 6px;border:1px solid var(--border);background:#fff;border-radius:10px;text-align:center;color:#56627a;font-size:10px}
    .platform-select.selected{border-color:#72aaff;background:#eef6ff;color:var(--primary);font-weight:700}
    .platform-select .picon{display:block;font-size:18px;margin-bottom:5px}
    .platform-editor{margin-top:17px;padding:15px;background:#fafcff;border:1px solid var(--border);border-radius:12px}
    .tabs{display:flex;gap:6px;margin-bottom:12px;overflow:auto}.tab{padding:7px 10px;border-radius:8px;background:#fff;border:1px solid var(--border);font-size:10px}.tab.active{background:var(--primary);color:#fff;border-color:var(--primary)}
    .field{margin-bottom:12px}.field label{display:block;font-size:10px;font-weight:700;margin-bottom:6px}.field input,.field textarea,.field select{width:100%;border:1px solid var(--border);border-radius:9px;padding:10px;outline:none;background:#fff;font-size:11px}.field textarea{min-height:80px}
    .side-card{padding:19px}.side-card+.side-card{margin-top:14px}.side-title{font-size:13px;font-weight:800;margin-bottom:15px}
    .radio{display:flex;gap:8px;align-items:center;padding:8px 0;font-size:11px}.radio input{accent-color:var(--primary)}
    .date-time{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.date-time input{width:100%;padding:9px;border:1px solid var(--border);border-radius:8px;font-size:10px}
    .status-line{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-top:1px solid #eef1f6}.status-line:first-of-type{border-top:0}
    .status-name{display:flex;align-items:center;gap:7px;font-size:10px}.status-dot{width:7px;height:7px;border-radius:50%;background:#20a76a}.status-dot.gray{background:#aeb7c5}.status-dot.red{background:#ef4444}
    .side-actions{display:grid;gap:8px;margin-top:14px}.outline{padding:10px;border:1px solid var(--border);background:#fff;border-radius:9px;font-size:11px;font-weight:700}.ai-btn{background:linear-gradient(135deg,#7657ff,#1677ff);color:#fff;padding:10px;border-radius:9px;font-size:11px;font-weight:700}
    /* Pages */
    .subpage{display:none}.subpage.active{display:block}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:760px}.table th{text-align:left;font-size:10px;color:#8a95a8;text-transform:uppercase;padding:12px;border-bottom:1px solid var(--border)}.table td{padding:13px 12px;border-bottom:1px solid #eef1f6;font-size:11px}
    .account-grid,.media-grid,.analytics-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.account{padding:18px}.account-top{display:flex;align-items:center;gap:10px}.social-logo{width:42px;height:42px;border-radius:12px;background:#f1f5f9;display:grid;place-items:center;font-size:20px}.account h4{font-size:12px}.account p{font-size:10px;color:var(--muted);margin-top:3px}.account .connect{margin-top:15px;width:100%;padding:9px;border-radius:9px;background:#eef6ff;color:var(--primary);font-size:10px;font-weight:700}
    .media-card{overflow:hidden}.media-image{height:145px;background:linear-gradient(135deg,#dcecff,#f1f5f9);display:grid;place-items:center;font-size:34px}.media-info{padding:12px}.media-info strong{font-size:11px}.media-info p{font-size:9px;color:var(--muted);margin-top:4px}
    .chart{height:220px;padding:18px;display:flex;align-items:flex-end;gap:10px}.bar{flex:1;background:linear-gradient(to top,#1677ff,#9dc8ff);border-radius:6px 6px 0 0;min-height:20px}.chart-labels{display:flex;gap:10px;padding:0 18px 18px}.chart-labels span{flex:1;text-align:center;font-size:9px;color:var(--muted)}
    .calendar{padding:18px}.cal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.cal-head h3{font-size:15px}.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);border-top:1px solid var(--border);border-left:1px solid var(--border)}.cal-cell{min-height:105px;border-right:1px solid var(--border);border-bottom:1px solid var(--border);padding:7px}.cal-cell>strong{font-size:10px;color:#7a869a}.event{font-size:8px;background:#eaf3ff;color:#1769d2;padding:5px;border-radius:5px;margin-top:7px;font-weight:700}.event.green{background:#e8f8f1;color:#078354}
    .toast{position:fixed;right:25px;bottom:25px;background:#13203a;color:#fff;padding:12px 16px;border-radius:10px;font-size:11px;box-shadow:0 12px 35px rgba(0,0,0,.18);opacity:0;transform:translateY(15px);pointer-events:none;transition:.25s;z-index:99}.toast.show{opacity:1;transform:translateY(0)}
    .modal{position:fixed;inset:0;background:rgba(10,24,45,.4);display:none;place-items:center;z-index:90}.modal.show{display:grid}.modal-box{width:min(540px,92vw);background:#fff;border-radius:18px;padding:22px;box-shadow:0 25px 80px rgba(0,0,0,.2)}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.modal-head h3{font-size:16px}.close{background:#f2f5f9;width:30px;height:30px;border-radius:8px}.ai-result{background:#f7faff;border:1px solid #dceaff;padding:14px;border-radius:10px;font-size:12px;line-height:1.7;margin:10px 0}
    @media(max-width:1050px){.stats{grid-template-columns:repeat(2,1fr)}.dashboard-grid,.composer-layout{grid-template-columns:1fr}.account-grid,.media-grid{grid-template-columns:repeat(2,1fr)}}
    @media(max-width:760px){.sidebar{width:68px;padding:16px 8px}.brand{padding:4px 6px 25px}.brand div:last-child,.nav button span:not(.icon),.nav-title,.user-mini div:last-child{display:none}.nav button{justify-content:center}.sidebar-bottom{left:8px;right:8px}.main{margin-left:68px;width:calc(100% - 68px)}.topbar{padding:0 15px}.search{display:none}.content{padding:20px 15px}.stats{grid-template-columns:1fr 1fr}.platform-grid{grid-template-columns:repeat(3,1fr)}.account-grid,.media-grid{grid-template-columns:1fr}.page-head h1{font-size:20px}.quick-actions{flex-wrap:wrap}.post-row{grid-template-columns:40px 1fr 80px}.post-row .platforms,.post-row .post-meta{display:none}}
  </style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-logo">➤</div>
      <div><strong>DINO SOCIAL HUB</strong><span>Social Media Manager</span></div>
    </div>
    <div class="nav-title">QUẢN LÝ</div>
    <nav class="nav">
      <button class="active" data-page="dashboard"><span class="icon">⌂</span><span>Dashboard</span></button>
      <button data-page="composer"><span class="icon">✎</span><span>Tạo bài viết</span></button>
      <button data-page="posts"><span class="icon">▤</span><span>Bài viết</span></button>
      <button data-page="calendar"><span class="icon">▣</span><span>Lịch đăng</span></button>
      <button data-page="accounts"><span class="icon">◎</span><span>Tài khoản Social</span></button>
      <button data-page="media"><span class="icon">▧</span><span>Media Library</span></button>
      <button data-page="analytics"><span class="icon">◒</span><span>Thống kê</span></button>
      <button data-page="notifications"><span class="icon">♢</span><span>Thông báo</span></button>
      <button data-page="settings"><span class="icon">⚙</span><span>Cài đặt</span></button>
    </nav>
    <div class="sidebar-bottom">
      <div class="user-mini">
        <div class="avatar">S</div>
        <div><strong>Sơn Dino</strong><span>taynguyenfilm@gmail.com</span></div>
      </div>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div class="breadcrumb">Dino Social Hub / <strong id="crumb">Dashboard</strong></div>
      <div class="top-actions">
        <input class="search" placeholder="⌕  Tìm kiếm bài viết..." id="globalSearch">
        <button class="icon-btn" id="notifyBtn">♢<i class="dot"></i></button>
        <button class="primary" id="newPost">＋ Tạo bài viết</button>
      </div>
    </header>

    
<div class="content" id="appContent"></div>
</div>
  </main>
</div>

<div class="toast" id="toast"></div>

<div class="modal" id="aiModal">
  <div class="modal-box">
    <div class="modal-head"><h3>✨ AI Content Assistant</h3><button class="close" onclick="closeAI()">×</button></div>
    <div class="field"><label>Chủ đề</label><input id="aiTopic" value="Tool đăng bài đa nền tảng"></div>
    <div class="field"><label>Đối tượng</label><input value="Cá nhân bán hàng, marketer, agency và doanh nghiệp"></div>
    <div class="field"><label>Tone</label><select><option>Chuyên nghiệp</option><option>Bán hàng</option><option>Viral</option><option>Gen Z</option></select></div>
    <button class="primary" style="width:100%" onclick="generateAI()">✨ Tạo nội dung</button>
    <div class="ai-result" id="aiResult" style="display:none"></div>
    <button class="secondary" id="applyAI" style="width:100%;display:none" onclick="applyAI()">Áp dụng vào bài viết</button>
  </div>
</div>

<script>
  const pageNames={dashboard:'Dashboard',composer:'Tạo bài viết',posts:'Bài viết',calendar:'Lịch đăng',accounts:'Tài khoản Social',media:'Media Library',analytics:'Thống kê',notifications:'Thông báo',settings:'Cài đặt'};
  let currentPlatform='Facebook';
  let generated='';

  function openPage(page){
    document.querySelectorAll('.subpage').forEach(x=>x.classList.remove('active'));
    document.getElementById('page-'+page).classList.add('active');
    document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('active',x.dataset.page===page));
    document.getElementById('crumb').textContent=pageNames[page];
    window.scrollTo({top:0,behavior:'smooth'});
  }

  document.querySelectorAll('.nav button').forEach(btn=>btn.addEventListener('click',()=>openPage(btn.dataset.page)));
  document.getElementById('newPost').onclick=()=>openPage('composer');
  document.getElementById('notifyBtn').onclick=()=>openPage('notifications');

  function showToast(msg){
    const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');
    clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>t.classList.remove('show'),2600);
  }

  function updateCount(){
    document.getElementById('count').textContent=document.getElementById('contentText').value.length;
  }

  function insertText(text){
    const area=document.getElementById('contentText');
    const start=area.selectionStart,end=area.selectionEnd;
    area.value=area.value.slice(0,start)+text+area.value.slice(end);
    area.focus();area.selectionStart=area.selectionEnd=start+text.length;updateCount();
  }

  document.getElementById('fileInput').addEventListener('change',function(){
    const preview=document.getElementById('mediaPreview');preview.innerHTML='';
    [...this.files].forEach(file=>{
      const wrap=document.createElement('div');wrap.className='media-item';
      if(file.type.startsWith('image/')){
        const img=document.createElement('img');img.src=URL.createObjectURL(file);wrap.appendChild(img);
      }else{
        const box=document.createElement('div');box.style='width:76px;height:62px;border-radius:8px;background:#eaf3ff;display:grid;place-items:center;font-size:22px';box.textContent='🎬';wrap.appendChild(box);
      }
      const rm=document.createElement('button');rm.className='remove-media';rm.textContent='×';rm.onclick=()=>wrap.remove();wrap.appendChild(rm);preview.appendChild(wrap);
    });
    if(this.files.length)showToast(this.files.length+' media đã được thêm ✓');
  });

  document.querySelectorAll('.platform-select').forEach(btn=>btn.addEventListener('click',()=>{
    btn.classList.toggle('selected');
    showToast(btn.classList.contains('selected')?btn.dataset.platform+' đã được chọn':'Đã bỏ chọn '+btn.dataset.platform);
  }));

  const fields={
    Facebook:`<div class="field"><label>Caption Facebook</label><textarea placeholder="Viết caption riêng cho Facebook...">Một nội dung – Đăng nhiều nền tảng – Tiết kiệm thời gian 🚀</textarea></div><div class="field"><label>Hashtag</label><input value="#DinoSocialHub #SocialMedia #Marketing"></div>`,
    TikTok:`<div class="field"><label>Caption TikTok</label><textarea placeholder="Caption TikTok..."></textarea></div><div class="field"><label>Hashtag</label><input value="#fyp #marketing #content"></div>`,
    YouTube:`<div class="field"><label>Tiêu đề</label><input value="Dino Social Hub – Đăng một lần, phủ sóng mọi nền tảng"></div><div class="field"><label>Mô tả</label><textarea placeholder="Mô tả video YouTube..."></textarea></div>`,
    Instagram:`<div class="field"><label>Caption Instagram</label><textarea placeholder="Caption Instagram..."></textarea></div><div class="field"><label>Hashtag</label><input value="#socialmedia #contentcreator #marketing"></div>`,
    X:`<div class="field"><label>Nội dung X</label><textarea placeholder="Viết nội dung cho X..." maxlength="280"></textarea></div>`
  };
  function renderPlatform(p){
    currentPlatform=p;
    document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.tab===p));
    document.getElementById('platformFields').innerHTML=fields[p];
  }
  document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>renderPlatform(t.dataset.tab)));
  renderPlatform('Facebook');

  function publishPost(){
    const text=document.getElementById('contentText').value.trim();
    if(!text){showToast('Vui lòng nhập nội dung trước khi đăng.');return}
    showToast('🚀 Đang đưa bài viết vào hàng đợi...');
    setTimeout(()=>showToast('✓ Bài viết đã được đăng thành công!'),1500);
  }
  function schedulePost(){
    showToast('📅 Bài viết đã được lên lịch thành công!');
  }

  function openAI(){document.getElementById('aiModal').classList.add('show')}
  function closeAI(){document.getElementById('aiModal').classList.remove('show')}
  function generateAI(){
    const topic=document.getElementById('aiTopic').value||'Social Media';
    generated=`🔥 ${topic} – quản lý content chưa bao giờ đơn giản như vậy!\\n\\nChỉ cần upload nội dung một lần, bạn có thể tùy chỉnh và đăng lên Facebook, TikTok, YouTube, Instagram và X ngay trên một dashboard duy nhất.\\n\\n✅ Upload hình ảnh/video một lần\\n✅ Đăng nhiều nền tảng\\n✅ Tùy chỉnh caption, hashtag riêng từng kênh\\n✅ Đặt lịch tự động\\n\\nMột nội dung – nhiều nền tảng – tiết kiệm tối đa thời gian vận hành. 🚀\\n\\n#SocialMedia #ContentMarketing #DinoSocialHub`;
    const r=document.getElementById('aiResult');r.style.display='block';r.textContent=generated;
    document.getElementById('applyAI').style.display='block';
  }
  function applyAI(){
    document.getElementById('contentText').value=generated;updateCount();closeAI();showToast('✓ Đã áp dụng nội dung AI vào bài viết');
  }

  document.getElementById('globalSearch').addEventListener('input',e=>{
    if(e.target.value.trim())showToast('Đang tìm kiếm: '+e.target.value);
  });
</script>
</body>
</html>

<script>
/* =========================================================
   DINO SOCIAL HUB v2
   Frontend local-first: dữ liệu lưu bằng localStorage.
   Đăng thật lên MXH cần backend/OAuth/API của từng nền tảng.
========================================================= */
const DB_KEY='dino_social_hub_v2';
const platforms=[
  {id:'facebook',name:'Facebook',icon:'f'},
  {id:'tiktok',name:'TikTok',icon:'♪'},
  {id:'youtube',name:'YouTube',icon:'▶'},
  {id:'instagram',name:'Instagram',icon:'◎'},
  {id:'x',name:'X',icon:'𝕏'}
];
const defaultDB={
  posts:[
    {id:crypto.randomUUID(),title:'Khóa học kỹ năng giao tiếp - Tự tin làm chủ giọng nói',content:'Khóa học kỹ năng giao tiếp giúp bạn tự tin hơn mỗi ngày.',platforms:['facebook','tiktok'],status:'published',schedule:'',created:Date.now()-86400000,media:[]},
    {id:crypto.randomUUID(),title:'Một nội dung – phủ sóng mọi nền tảng',content:'Đăng một lần lên nhiều nền tảng cùng Dino Social Hub.',platforms:['facebook','instagram','x'],status:'scheduled',schedule:'2026-08-30T19:30',created:Date.now()-3600000,media:[]}
  ],
  accounts:{
    facebook:[{id:'fb1',name:'Tây Nguyên Phim',connected:true}],
    tiktok:[{id:'tt1',name:'@taynguyenphim',connected:true}],
    youtube:[{id:'yt1',name:'Tây Nguyên Phim Official',connected:true}],
    instagram:[],x:[]
  },
  media:[],
  settings:{name:'Sơn Dino',email:'taynguyenfilm@gmail.com',timezone:'Asia/Ho_Chi_Minh',theme:'light'}
};
let db=loadDB();
let page='dashboard';
let composer={content:'',title:'',platforms:['facebook','tiktok'],schedule:'',mode:'now',media:[],perPlatform:{}};
let toastTimer;

function loadDB(){
  try{return JSON.parse(localStorage.getItem(DB_KEY))||structuredClone(defaultDB)}
  catch(e){return structuredClone(defaultDB)}
}
function saveDB(){localStorage.setItem(DB_KEY,JSON.stringify(db))}
function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function fmtDate(v){
  if(!v)return '—';
  const d=new Date(v);
  return d.toLocaleString('vi-VN',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});
}
function platform(id){
  return platforms.find(p=>p.id===id)||platforms[0];
}
function toast(msg){
  const t=document.getElementById('toast'); t.textContent=msg;t.classList.add('show');
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),2600);
}
function navigate(p){
  page=p; document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));
  document.getElementById('crumb').textContent=({
    dashboard:'Dashboard',composer:'Tạo bài viết',posts:'Bài viết',calendar:'Lịch đăng',
    accounts:'Tài khoản Social',media:'Media Library',analytics:'Thống kê',
    notifications:'Thông báo',settings:'Cài đặt'
  })[p]||p;
  render();
}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=e=>{e.preventDefault();navigate(b.dataset.page)});
document.getElementById('newPost').onclick=()=>navigate('composer');
document.getElementById('notifyBtn').onclick=()=>navigate('notifications');

function render(){
  const root=document.getElementById('appContent');
  const views={dashboard:renderDashboard,composer:renderComposer,posts:renderPosts,calendar:renderCalendar,
    accounts:renderAccounts,media:renderMedia,analytics:renderAnalytics,notifications:renderNotifications,settings:renderSettings};
  root.innerHTML=(views[page]||renderDashboard)();
  bindPage();
}

function statCard(label,value,trend,icon){
  return `<div class="card stat"><div><small>${label}</small><h2>${value}</h2><span class="trend">${trend}</span></div><div class="stat-icon">${icon}</div></div>`;
}
function renderDashboard(){
  const total=db.posts.length, published=db.posts.filter(x=>x.status==='published').length;
  const scheduled=db.posts.filter(x=>x.status==='scheduled').length, failed=db.posts.filter(x=>x.status==='failed').length;
  const upcoming=db.posts.filter(x=>x.status==='scheduled').sort((a,b)=>new Date(a.schedule)-new Date(b.schedule)).slice(0,5);
  return `<section>
    <div class="page-head"><div><h1>Xin chào, ${esc(db.settings.name)} 👋</h1><p>Quản lý nội dung Social Media từ một nơi.</p></div></div>
    <div class="stats">${statCard('Tổng bài viết',total,'↗ Dữ liệu thật','▤')}${statCard('Đã đăng',published,'✓ Hoàn tất','✓')}${statCard('Đã lên lịch',scheduled,'◷ Đang chờ','◷')}${statCard('Thất bại',failed,'! Cần xử lý','!')}</div>
    <div class="card quick" style="margin-bottom:18px"><h3>Tạo nội dung mới</h3><p>Upload media, chọn nhiều nền tảng, tùy chỉnh từng kênh và lưu lịch đăng.</p>
      <div class="quick-actions"><button class="primary" data-action="new">＋ Tạo bài viết</button><button class="secondary" data-action="media">▧ Media Library</button><button class="secondary" data-action="calendar">◷ Lịch đăng</button><button class="secondary" data-action="export">⇩ Sao lưu dữ liệu</button></div>
    </div>
    <div class="dashboard-grid">
      <div class="card section"><div class="section-head"><h3>Bài viết gần đây</h3><span data-action="posts">Xem tất cả →</span></div>
        ${db.posts.slice().sort((a,b)=>b.created-a.created).slice(0,6).map(postRow).join('')||'<p style="color:var(--muted);font-size:12px">Chưa có bài viết.</p>'}
      </div>
      <div class="card section"><div class="section-head"><h3>Sắp đăng</h3><span data-action="calendar">Lịch →</span></div>
        ${upcoming.map(p=>`<div class="schedule-item"><div class="date-box"><strong>${new Date(p.schedule).getDate()}</strong><span>Tháng ${new Date(p.schedule).getMonth()+1}</span></div><div><strong>${esc(p.title||'Bài viết')}</strong><p>${p.platforms.map(x=>platform(x).name).join(' · ')}</p></div><div class="schedule-time">${new Date(p.schedule).toLocaleTimeString('vi-VN',{hour:'2-digit',minute:'2-digit'})}</div></div>`).join('')||'<p style="color:var(--muted);font-size:11px">Chưa có lịch.</p>'}
      </div>
    </div>
  </section>`;
}
function postRow(p){
  return `<div class="post-row"><div class="thumb">${p.media.length?'▧':'✎'}</div>
    <div><div class="post-title">${esc(p.title||p.content.slice(0,60)||'Không có tiêu đề')}</div><div class="post-meta">${fmtDate(p.created)}</div></div>
    <div class="platforms">${p.platforms.map(x=>`<i class="platform">${platform(x).icon}</i>`).join('')}</div>
    <div><span class="badge ${p.status==='published'?'success':p.status==='scheduled'?'schedule':p.status==='failed'?'danger':'gray'}">${({published:'Đã đăng',scheduled:'Đã lên lịch',failed:'Thất bại',draft:'Bản nháp'})[p.status]}</span></div>
    <div><button class="secondary" data-edit="${p.id}">Sửa</button></div></div>`;
}

function renderComposer(){
  const selected=composer.platforms;
  const tabs=selected.map(id=>`<button class="tab ${id===selected[0]?'active':''}" data-tab="${id}">${platform(id).name}</button>`).join('');
  return `<section>
    <div class="page-head"><div><h1>${composer.editId?'Chỉnh sửa bài viết':'Tạo bài viết'}</h1><p>Một nội dung – nhiều nền tảng – tiết kiệm thời gian.</p></div>
      <div style="display:flex;gap:8px"><button class="secondary" data-action="saveDraft">Lưu nháp</button><button class="primary" data-action="publish">🚀 ${composer.mode==='schedule'?'Lên lịch':'Đăng ngay'}</button></div></div>
    <div class="composer-layout">
      <div class="card editor-card">
        <div class="editor-title">1. Nội dung chung</div>
        <div class="editor-tools"><button class="tool" data-action="emoji">😊 Emoji</button><button class="tool" data-action="hashtag"># Hashtag</button><button class="tool" data-action="clear">⌫ Xóa</button><button class="ai-btn" style="margin-left:auto" data-action="ai">✨ AI viết content</button></div>
        <div class="field"><label>Tiêu đề</label><input id="cTitle" value="${esc(composer.title)}" placeholder="Tên/tiêu đề nội dung"></div>
        <textarea id="cContent" placeholder="Viết nội dung của bạn...">${esc(composer.content)}</textarea>
        <div class="counter"><span id="cCount">${composer.content.length}</span> ký tự</div>
        <div class="upload" id="uploadBox"><div class="upload-icon">⇧</div><strong>Thêm hình ảnh hoặc video</strong><p>Click hoặc kéo thả · JPG, PNG, WEBP, MP4, MOV</p></div>
        <input id="cFile" type="file" multiple accept="image/*,video/*" style="display:none">
        <div class="media-preview">${composer.media.map((m,i)=>`<div class="media-item"><img src="${m.url}"><button class="remove-media" data-rm="${i}">×</button></div>`).join('')}</div>
        <div class="platform-section"><div class="label">2. Chọn nền tảng</div><div class="platform-grid">
          ${platforms.map(p=>{const connected=(db.accounts[p.id]||[]).some(a=>a.connected);return `<button class="platform-select ${selected.includes(p.id)?'selected':''}" data-platform="${p.id}" ${!connected?'title="Chưa kết nối"':''}><span class="picon">${p.icon}</span>${p.name}<small style="display:block;color:${connected?'#16a36a':'#a0a9b7'}">${connected?'Đã kết nối':'Chưa kết nối'}</small></button>`}).join('')}
        </div></div>
        <div class="platform-editor"><div class="tabs">${tabs||'<span style="font-size:11px;color:var(--muted)">Chọn ít nhất một nền tảng.</span>'}</div><div id="platformFields">${renderPlatformFields(selected[0])}</div></div>
      </div>
      <div>
        <div class="card side-card"><div class="side-title">Lịch đăng</div>
          <label class="radio"><input type="radio" name="mode" value="now" ${composer.mode==='now'?'checked':''}> Đăng ngay</label>
          <label class="radio"><input type="radio" name="mode" value="schedule" ${composer.mode==='schedule'?'checked':''}> Đặt lịch đăng</label>
          <div class="date-time"><input id="cDate" type="date" value="${composer.schedule?composer.schedule.slice(0,10):new Date().toISOString().slice(0,10)}"><input id="cTime" type="time" value="${composer.schedule?composer.schedule.slice(11,16):'19:30'}"></div>
          <div style="font-size:9px;color:var(--muted);margin-top:8px">Múi giờ: ${db.settings.timezone}</div>
        </div>
        <div class="card side-card"><div class="side-title">Tài khoản đăng</div>${selected.map(id=>`<div class="field"><label>${platform(id).name}</label><select data-account="${id}">${(db.accounts[id]||[]).filter(a=>a.connected).map(a=>`<option value="${a.id}">${esc(a.name)}</option>`).join('')||'<option>Chưa kết nối</option>'}</select></div>`).join('')}</div>
        <div class="card side-card"><div class="side-title">Kiểm tra trước khi đăng</div>
          <div class="status-line"><span class="status-name">Nền tảng</span><b>${selected.length}</b></div>
          <div class="status-line"><span class="status-name">Media</span><b>${composer.media.length}</b></div>
          <div class="status-line"><span class="status-name">Nội dung</span><b>${composer.content.trim()?'✓':'!'}</b></div>
        </div>
        <div class="side-actions"><button class="ai-btn" data-action="ai">✨ Tối ưu content bằng AI</button><button class="primary" data-action="publish">🚀 ${composer.mode==='schedule'?'Lên lịch đăng':'Đăng ngay'}</button></div>
      </div>
    </div>
  </section>`;
}
function renderPlatformFields(id){
  if(!id)return '';
  const v=composer.perPlatform[id]||{};
  if(id==='youtube')return `<div class="field"><label>Tiêu đề YouTube</label><input data-pp="title" value="${esc(v.title||composer.title)}"></div><div class="field"><label>Mô tả</label><textarea data-pp="description">${esc(v.description||composer.content)}</textarea></div>`;
  return `<div class="field"><label>Caption ${platform(id).name}</label><textarea data-pp="caption">${esc(v.caption||composer.content)}</textarea></div><div class="field"><label>Hashtag</label><input data-pp="hashtags" value="${esc(v.hashtags||'#DinoSocialHub #ContentMarketing')}"></div>`;
}

function renderPosts(){
  return `<section><div class="page-head"><div><h1>Bài viết</h1><p>Tìm kiếm, lọc, sửa, nhân bản và quản lý trạng thái.</p></div><button class="primary" data-action="new">＋ Tạo bài viết</button></div>
  <div class="card section"><div class="section-head"><div style="display:flex;gap:8px"><input class="search" id="postSearch" placeholder="Tìm nội dung..."><select id="statusFilter" class="secondary"><option value="">Tất cả</option><option value="published">Đã đăng</option><option value="scheduled">Đã lên lịch</option><option value="draft">Bản nháp</option><option value="failed">Thất bại</option></select></div><span>${db.posts.length} bài</span></div>
  <div id="postTable">${postTable()}</div></div></section>`;
}
function postTable(){
 const q=(document.getElementById('postSearch')?.value||'').toLowerCase(), f=document.getElementById('statusFilter')?.value||'';
 const arr=db.posts.filter(p=>(!q||(p.title+' '+p.content).toLowerCase().includes(q))&&(!f||p.status===f)).sort((a,b)=>b.created-a.created);
 return `<div class="table-wrap"><table class="table"><thead><tr><th>Nội dung</th><th>Nền tảng</th><th>Thời gian</th><th>Trạng thái</th><th>Thao tác</th></tr></thead><tbody>${arr.map(p=>`<tr><td><b>${esc(p.title||p.content.slice(0,55))}</b><div style="color:#8994a8;margin-top:3px">${esc(p.content.slice(0,80))}</div></td><td>${p.platforms.map(x=>platform(x).name).join(' · ')}</td><td>${p.schedule?fmtDate(p.schedule):fmtDate(p.created)}</td><td><span class="badge ${p.status==='published'?'success':p.status==='scheduled'?'schedule':p.status==='failed'?'danger':'gray'}">${({published:'Đã đăng',scheduled:'Đã lên lịch',failed:'Thất bại',draft:'Bản nháp'})[p.status]}</span></td><td style="display:flex;gap:5px"><button class="secondary" data-edit="${p.id}">Sửa</button><button class="secondary" data-duplicate="${p.id}">Nhân bản</button><button class="secondary" data-delete="${p.id}">Xóa</button></td></tr>`).join('')||'<tr><td colspan="5">Không tìm thấy bài viết.</td></tr>'}</tbody></table></div>`;
}

function renderCalendar(){
 const d=new Date(); const y=d.getFullYear(),m=d.getMonth(),first=new Date(y,m,1).getDay(); const offset=(first+6)%7; const days=new Date(y,m+1,0).getDate();
 let cells=''; for(let i=0;i<offset;i++)cells+='<div class="cal-cell"></div>';
 for(let day=1;day<=days;day++){const items=db.posts.filter(p=>p.status==='scheduled'&&p.schedule&&new Date(p.schedule).getDate()===day&&new Date(p.schedule).getMonth()===m&&new Date(p.schedule).getFullYear()===y);cells+=`<div class="cal-cell"><strong>${day}</strong>${items.map(p=>`<div class="event" data-edit="${p.id}">${new Date(p.schedule).toLocaleTimeString('vi-VN',{hour:'2-digit',minute:'2-digit'})} · ${esc((p.title||'Bài viết').slice(0,22))}</div>`).join('')}</div>`}
 return `<section><div class="page-head"><div><h1>Lịch đăng</h1><p>Click vào bài để chỉnh sửa. Lịch được lưu trên trình duyệt.</p></div><button class="primary" data-action="new">＋ Tạo bài viết</button></div><div class="card calendar"><div class="cal-head"><h3>Tháng ${m+1}, ${y}</h3><button class="secondary" data-action="today">Hôm nay</button></div><div class="cal-grid">${['T2','T3','T4','T5','T6','T7','CN'].map(x=>`<div class="cal-cell" style="min-height:auto;background:#f8fafc"><strong>${x}</strong></div>`).join('')}${cells}</div></div></section>`;
}
function renderAccounts(){
 return `<section><div class="page-head"><div><h1>Tài khoản Social</h1><p>Kết nối nhiều tài khoản/kênh. Bản demo quản lý trạng thái; OAuth thật cần backend.</p></div><button class="primary" data-action="connect">＋ Thêm tài khoản</button></div>
 <div class="account-grid">${platforms.map(p=>`<div class="card account"><div class="account-top"><div class="social-logo">${p.icon}</div><div><h4>${p.name}</h4><p>${(db.accounts[p.id]||[]).length} tài khoản</p></div></div>
 ${(db.accounts[p.id]||[]).map(a=>`<div style="display:flex;justify-content:space-between;align-items:center;margin-top:13px"><span style="font-size:11px">${esc(a.name)}</span><button class="secondary" data-disconnect="${p.id}|${a.id}">${a.connected?'Ngắt kết nối':'Kết nối lại'}</button></div>`).join('')||'<p style="font-size:10px;color:var(--muted);margin-top:14px">Chưa có tài khoản.</p>'}
 <button class="connect" data-addaccount="${p.id}">＋ Thêm ${p.name}</button></div>`).join('')}</div></section>`;
}
function renderMedia(){
 return `<section><div class="page-head"><div><h1>Media Library</h1><p>Quản lý media đã upload trong trình duyệt.</p></div><button class="primary" data-action="upload">⇧ Upload Media</button></div>
 <input id="mediaFile" type="file" multiple accept="image/*,video/*" style="display:none"><div class="media-grid">${db.media.map((m,i)=>`<div class="card media-card"><div class="media-image">${m.type.startsWith('video')?'🎬':`<img src="${m.url}" style="width:100%;height:100%;object-fit:cover">`}</div><div class="media-info"><strong>${esc(m.name)}</strong><p>${m.type} · ${Math.round(m.size/1024)} KB</p><button class="secondary" data-delmedia="${i}" style="margin-top:8px">Xóa</button></div></div>`).join('')||'<div class="card section" style="grid-column:1/-1"><p style="font-size:12px;color:var(--muted)">Chưa có media. Hãy upload hình ảnh/video.</p></div>'}</div></section>`;
}
function renderAnalytics(){
 const total=db.posts.length, published=db.posts.filter(p=>p.status==='published').length, platformsCount=platforms.map(p=>({name:p.name,n:db.posts.filter(x=>x.platforms.includes(p.id)).length}));
 return `<section><div class="page-head"><div><h1>Thống kê</h1><p>Thống kê vận hành nội dung (không phải số liệu native từ MXH).</p></div></div>
 <div class="stats">${statCard('Tổng bài',total,'↗ local data','▤')}${statCard('Đã đăng',published,'✓','✓')}${statCard('Tỷ lệ hoàn tất',total?Math.round(published/total*100)+'%':'0%','↗','◒')}${statCard('Media',db.media.length,'▧','▧')}</div>
 <div class="card section"><div class="section-head"><h3>Số bài theo nền tảng</h3></div>${platformsCount.map(x=>`<div style="display:flex;align-items:center;gap:10px;margin:13px 0;font-size:11px"><b style="width:80px">${x.name}</b><div style="height:10px;background:#eaf3ff;border-radius:20px;flex:1;overflow:hidden"><div style="height:100%;width:${total?Math.max(3,x.n/Math.max(1,total)*100):0}%;background:#1677ff"></div></div><span>${x.n}</span></div>`).join('')}</div></section>`;
}
function renderNotifications(){
 const failed=db.posts.filter(p=>p.status==='failed');
 return `<section><div class="page-head"><div><h1>Thông báo</h1><p>Các sự kiện cần chú ý.</p></div><button class="secondary" data-action="clearNotifications">Đánh dấu đã đọc</button></div><div class="card section">
 <div class="schedule-item"><div class="date-box">✓</div><div><strong>Hệ thống local đã sẵn sàng.</strong><p>Dữ liệu được lưu trong trình duyệt của bạn.</p></div></div>
 ${failed.map(p=>`<div class="schedule-item"><div class="date-box">!</div><div><strong>Bài viết thất bại: ${esc(p.title)}</strong><p>Kiểm tra tài khoản/API rồi thử lại.</p></div></div>`).join('')}
 </div></section>`;
}
function renderSettings(){
 return `<section><div class="page-head"><div><h1>Cài đặt</h1><p>Thiết lập hồ sơ, dữ liệu và giao diện.</p></div></div><div class="card section" style="max-width:800px">
 <div class="field"><label>Tên hiển thị</label><input id="sName" value="${esc(db.settings.name)}"></div><div class="field"><label>Email</label><input id="sEmail" value="${esc(db.settings.email)}"></div>
 <div class="field"><label>Múi giờ</label><select id="sTimezone"><option ${db.settings.timezone.includes('Ho_Chi')?'selected':''}>Asia/Ho_Chi_Minh</option><option>Asia/Bangkok</option><option>UTC</option></select></div>
 <div class="field"><label>Giao diện</label><select id="sTheme"><option value="light" ${db.settings.theme==='light'?'selected':''}>Sáng</option><option value="dark" ${db.settings.theme==='dark'?'selected':''}>Tối</option></select></div>
 <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="primary" data-action="saveSettings">Lưu thay đổi</button><button class="secondary" data-action="export">⇩ Export JSON</button><button class="secondary" data-action="import">⇧ Import JSON</button><button class="secondary" data-action="reset">↺ Reset dữ liệu demo</button></div>
 <input id="importFile" type="file" accept=".json" style="display:none">
 <div style="margin-top:20px;padding:13px;background:#fff8e8;border:1px solid #f5dfad;border-radius:10px;font-size:10px;color:#80621e"><b>Lưu ý:</b> HTML này chạy độc lập. Nó có CRUD, localStorage, upload preview, lịch, tìm kiếm, nhân bản và export/import. Muốn đăng thật lên Facebook/TikTok/YouTube/Instagram/X cần kết nối OAuth/API qua backend.</div>
 </div></section>`;
}

function bindPage(){
 document.querySelectorAll('[data-action]').forEach(el=>el.onclick=()=>handleAction(el.dataset.action));
 document.querySelectorAll('[data-edit]').forEach(el=>el.onclick=()=>editPost(el.dataset.edit));
 document.querySelectorAll('[data-delete]').forEach(el=>el.onclick=()=>deletePost(el.dataset.delete));
 document.querySelectorAll('[data-duplicate]').forEach(el=>el.onclick=()=>duplicatePost(el.dataset.duplicate));
 document.querySelectorAll('[data-platform]').forEach(el=>el.onclick=()=>toggleComposerPlatform(el.dataset.platform));
 document.querySelectorAll('[data-tab]').forEach(el=>el.onclick=()=>selectComposerTab(el.dataset.tab));
 document.querySelectorAll('[data-rm]').forEach(el=>el.onclick=()=>{composer.media.splice(+el.dataset.rm,1);render()});
 document.querySelectorAll('[data-addaccount]').forEach(el=>el.onclick=()=>addAccount(el.dataset.addaccount));
 document.querySelectorAll('[data-disconnect]').forEach(el=>el.onclick=()=>disconnect(el.dataset.disconnect));
 const c=document.getElementById('cContent'); if(c)c.oninput=()=>{composer.content=c.value;document.getElementById('cCount').textContent=c.value.length}
 const title=document.getElementById('cTitle');if(title)title.oninput=()=>composer.title=title.value;
 document.querySelectorAll('input[name="mode"]').forEach(x=>x.onchange=()=>{composer.mode=x.value;render()});
 const up=document.getElementById('uploadBox');if(up){up.onclick=()=>document.getElementById('cFile').click()}
 const cf=document.getElementById('cFile');if(cf)cf.onchange=e=>readFiles(e.target.files,true);
 const mf=document.getElementById('mediaFile');if(mf)mf.onchange=e=>readFiles(e.target.files,false);
 const ps=document.getElementById('postSearch');if(ps)ps.oninput=()=>document.getElementById('postTable').innerHTML=postTable();
 const sf=document.getElementById('statusFilter');if(sf)sf.onchange=()=>document.getElementById('postTable').innerHTML=postTable();
 document.querySelectorAll('[data-pp]').forEach(el=>el.oninput=()=>{composer.perPlatform[composer.activeTab||composer.platforms[0]] ||= {};composer.perPlatform[composer.activeTab||composer.platforms[0]][el.dataset.pp]=el.value});
}
function handleAction(a){
 if(a==='new'){composer={content:'',title:'',platforms:['facebook','tiktok'],schedule:'',mode:'now',media:[],perPlatform:{}};navigate('composer')}
 if(a==='posts')navigate('posts'); if(a==='calendar')navigate('calendar'); if(a==='media')navigate('media');
 if(a==='publish')savePost(composer.mode==='schedule'?'scheduled':'published');
 if(a==='saveDraft')savePost('draft');
 if(a==='emoji'){composer.content+=' 😊';render()}
 if(a==='hashtag'){composer.content+=(composer.content?' ':'')+'#DinoSocialHub #ContentMarketing';render()}
 if(a==='clear'){composer.content='';render()}
 if(a==='ai'){aiMock()}
 if(a==='upload')document.getElementById('mediaFile').click();
 if(a==='connect')addAccount('facebook');
 if(a==='saveSettings'){db.settings.name=document.getElementById('sName').value;db.settings.email=document.getElementById('sEmail').value;db.settings.timezone=document.getElementById('sTimezone').value;db.settings.theme=document.getElementById('sTheme').value;saveDB();applyTheme();toast('✓ Đã lưu cài đặt');}
 if(a==='export')exportDB();
 if(a==='import')document.getElementById('importFile').click();
 if(a==='reset'){if(confirm('Reset toàn bộ dữ liệu demo?')){db=structuredClone(defaultDB);saveDB();toast('Đã reset');render()}}
 if(a==='clearNotifications')toast('✓ Đã đánh dấu đã đọc');
}
function toggleComposerPlatform(id){
 if(!(db.accounts[id]||[]).some(a=>a.connected)){toast('Nền tảng chưa kết nối. Vào Tài khoản Social để thêm.');return}
 if(composer.platforms.includes(id)){if(composer.platforms.length===1)return toast('Phải giữ ít nhất một nền tảng');composer.platforms=composer.platforms.filter(x=>x!==id)}
 else composer.platforms.push(id);
 composer.activeTab=composer.platforms[0];render();
}
function selectComposerTab(id){composer.activeTab=id;render()}
function readFiles(files,forComposer){
 [...files].forEach(file=>{
   if(file.size>30*1024*1024)return toast('File quá lớn: '+file.name);
   const r=new FileReader();r.onload=()=>{
     const m={name:file.name,type:file.type,size:file.size,url:r.result};
     if(forComposer)composer.media.push(m);else db.media.push(m);
     saveDB();render();
   };r.readAsDataURL(file);
 }); if(files.length)toast('Đang thêm '+files.length+' file...');
}
function savePost(status){
 if(!composer.content.trim())return toast('⚠ Vui lòng nhập nội dung');
 if(!composer.platforms.length)return toast('⚠ Chọn ít nhất một nền tảng');
 const date=document.getElementById('cDate')?.value,time=document.getElementById('cTime')?.value;
 const schedule=(composer.mode==='schedule'&&date&&time)?`${date}T${time}`:'';
 if(composer.editId){
   const p=db.posts.find(x=>x.id===composer.editId);Object.assign(p,{title:composer.title,content:composer.content,platforms:composer.platforms,status,schedule,media:composer.media,created:Date.now(),perPlatform:composer.perPlatform});
 }else db.posts.push({id:crypto.randomUUID(),title:composer.title||composer.content.slice(0,55),content:composer.content,platforms:[...composer.platforms],status,schedule,created:Date.now(),media:[...composer.media],perPlatform:composer.perPlatform});
 saveDB();toast(status==='scheduled'?'📅 Đã lên lịch bài viết!':status==='draft'?'✓ Đã lưu bản nháp!':'🚀 Đã lưu bài đăng thành công!');navigate('posts');
}
function editPost(id){
 const p=db.posts.find(x=>x.id===id);if(!p)return;
 composer={editId:id,title:p.title,content:p.content,platforms:[...p.platforms],schedule:p.schedule||'',mode:p.status==='scheduled'?'schedule':'now',media:[...p.media],perPlatform:p.perPlatform||{},activeTab:p.platforms[0]};
 navigate('composer');
}
function deletePost(id){if(confirm('Xóa bài viết này?')){db.posts=db.posts.filter(p=>p.id!==id);saveDB();toast('Đã xóa bài viết');render()}}
function duplicatePost(id){const p=db.posts.find(x=>x.id===id);if(!p)return;db.posts.push({...structuredClone(p),id:crypto.randomUUID(),title:p.title+' (Copy)',status:'draft',schedule:'',created:Date.now()});saveDB();toast('✓ Đã nhân bản');render()}
function addAccount(id){
 const name=prompt('Tên tài khoản/kênh '+platform(id).name+':',platform(id).name==='Facebook'?'Tây Nguyên Phim':'@your_account');
 if(!name)return;db.accounts[id] ||= [];db.accounts[id].push({id:crypto.randomUUID(),name,connected:true});saveDB();toast('✓ Đã thêm tài khoản (demo)');render();
}
function disconnect(v){const [pid,aid]=v.split('|');const a=(db.accounts[pid]||[]).find(x=>x.id===aid);if(a){a.connected=!a.connected;saveDB();render()}}
function aiMock(){
 const topic=composer.title||composer.content.slice(0,40)||'nội dung Social Media';
 composer.content=`🔥 ${topic}\\n\\nBạn đang mất quá nhiều thời gian để đăng cùng một nội dung lên nhiều nền tảng?\\n\\nVới Dino Social Hub, bạn có thể:\\n✅ Upload hình ảnh/video một lần\\n✅ Chọn nhiều nền tảng\\n✅ Tùy chỉnh caption & hashtag riêng từng kênh\\n✅ Đặt lịch đăng\\n✅ Quản lý nhiều tài khoản\\n\\nMột nội dung – nhiều nền tảng – tiết kiệm thời gian vận hành. 🚀\\n\\n#DinoSocialHub #SocialMedia #ContentMarketing`;
 toast('✨ AI đã tạo nội dung mẫu');render();
}
function exportDB(){
 const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='dino-social-hub-backup.json';a.click();URL.revokeObjectURL(a.href);toast('✓ Đã xuất dữ liệu');
}
document.addEventListener('change',e=>{
 if(e.target.id==='importFile')return; 
});
document.addEventListener('change',e=>{
 if(e.target.id==='importFile'&&e.target.files[0]){
  const r=new FileReader();r.onload=()=>{try{db=JSON.parse(r.result);saveDB();render();toast('✓ Đã import dữ liệu')}catch(_){toast('File JSON không hợp lệ')}};r.readAsText(e.target.files[0]);
 }
});
function applyTheme(){document.body.style.background=db.settings.theme==='dark'?'#0f172a':'';document.body.style.color=db.settings.theme==='dark'?'#e5e7eb':''}
document.getElementById('globalSearch').oninput=e=>{
 if(page!=='posts')return; navigate('posts');setTimeout(()=>{const s=document.getElementById('postSearch');s.value=e.target.value;s.dispatchEvent(new Event('input'))},0)
};
applyTheme();render();
</script>
