<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Auto Post Facebook</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
font-family: 'Segoe UI', Tahoma, sans-serif;
background: linear-gradient(135deg, #1877f2, #0a4c9e);
min-height: 100vh;
display: flex;
justify-content: center;
align-items: center;
padding: 20px;
}
.card {
background: #fff;
width: 100%;
max-width: 560px;
border-radius: 16px;
box-shadow: 0 10px 40px rgba(0,0,0,0.25);
overflow: hidden;
}
.header {
background: #1877f2;
color: #fff;
padding: 20px 24px;
}
.header h1 { font-size: 20px; font-weight: 700; }
.header p { font-size: 13px; opacity: 0.85; margin-top: 4px; }
.body { padding: 24px; }
label {
display: block;
font-size: 13px;
font-weight: 600;
color: #333;
margin-bottom: 6px;
}
textarea, select, input {
width: 100%;
padding: 12px 14px;
border: 1px solid #ddd;
border-radius: 8px;
font-size: 14px;
font-family: inherit;
margin-bottom: 18px;
transition: border 0.2s, box-shadow 0.2s;
}
textarea { resize: vertical; min-height: 130px; }
textarea:focus, select:focus, input:focus {
outline: none;
border-color: #1877f2;
box-shadow: 0 0 0 3px rgba(24,119,242,0.15);
}
.btn {
width: 100%;
padding: 14px;
background: #1877f2;
color: #fff;
border: none;
border-radius: 8px;
font-size: 16px;
font-weight: 700;
cursor: pointer;
transition: background 0.2s, transform 0.1s;
}
.btn:hover { background: #166fe5; }
.btn:active { transform: scale(0.98); }
.btn:disabled { background: #9db6d8; cursor: not-allowed; }
.status {
margin-top: 14px;
padding: 12px;
border-radius: 8px;
font-size: 14px;
display: none;
}
.status.success { display: block; background: #e8f5e9; color: #1b5e20; }
.status.error { display: block; background: #fdecea; color: #b71c1c; }
.status.loading { display: block; background: #e3f2fd; color: #0d47a1; }
.small { font-size: 12px; color: #888; margin-top: 12px; line-height: 1.5; }
.refresh {
display: inline-block;
font-size: 12px;
color: #1877f2;
cursor: pointer;
margin-bottom: 10px;
text-decoration: underline;
}
</style>
</head>
<body>

📢 Auto Post Facebook
Đăng bài tự động lên fanpage của bạn

<label for="page">Chọn fanpage</label>
<select id="page">
<option value="">— Đang tải danh sách fanpage... —</option>
</select>
🔄 Tải lại danh sách

<label for="content">Nội dung bài đăng</label>
<textarea id="content" placeholder="Nhập nội dung bài đăng ở đây..."></textarea>

<label for="image">Link ảnh (tùy chọn)</label>
<input type="text" id="image" placeholder="https://... (bỏ trống nếu không có ảnh)">

<button class="btn" id="submitBtn" onclick="postToFb()">🚀 Đăng bài</button>

<script>
// 🔴 THAY 2 WEBHOOK NÀY BẰNG WEBHOOK CỦA BẠN (tạo trên Make.com)
const WEBHOOK_LIST = "https://hook.make.com/WEBHOOK-LAY-DANH-SACH";
const WEBHOOK_POST = "https://hook.make.com/WEBHOOK-DANG-BAI";

async function loadPages() {
const select = document.getElementById('page');
select.innerHTML = '<option value="">— Đang tải... —</option>';
try {
const res = await fetch(WEBHOOK_LIST);
const pages = await res.json();
select.innerHTML = '<option value="">— Chọn fanpage —</option>';
if (Array.isArray(pages) && pages.length === 0) {
select.innerHTML = '<option value="">Không có fanpage nào</option>';
}
pages.forEach(p => {
const opt = document.createElement('option');
opt.value = p.id || p.page_id;
opt.textContent = p.name || p.page_name;
select.appendChild(opt);
});
} catch (e) {
console.error('Lỗi tải danh sách:', e);
select.innerHTML = '<option value="">Lỗi tải danh sách 😢</option>';
}
}

async function postToFb() {
const page = document.getElementById('page').value;
const content = document.getElementById('content').value.trim();
const image = document.getElementById('image').value.trim();
const status = document.getElementById('status');
const btn = document.getElementById('submitBtn');

if (!page) { showStatus('⚠️ Vui lòng chọn fanpage!', 'error'); return; }
if (!content) { showStatus('⚠️ Vui lòng nhập nội dung!', 'error'); return; }

btn.disabled = true;
showStatus('⏳ Đang đăng bài...', 'loading');

const payload = {
page_id: page,
content: content,
image: image || null,
timestamp: new Date().toISOString()
};

try {
const res = await fetch(WEBHOOK_POST, {
method: 'POST',
headers: { 'Content-Type': 'application/json' },
body: JSON.stringify(payload)
});
const result = await res.json().catch(() => ({}));
if (result.error) {
showStatus('❌ Lỗi: ' + result.error, 'error');
} else {
showStatus('✅ Đã gửi! Make.com đang xử lý đăng lên fanpage.', 'success');
document.getElementById('content').value = '';
document.getElementById('image').value = '';
}
} catch (e) {
  showStatus('❌ Lỗi kết nối: ' + e.message, 'error');
} finally {
btn.disabled = false;
}
}

function showStatus(msg, type) {
const el = document.getElementById('status');
el.className = 'status ' + type;
el.textContent = msg;
}

window.onload = loadPages;
</script>
</body>
</html>
